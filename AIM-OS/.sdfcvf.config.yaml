# SDF-CVF Quintet Parity Configuration
# Configuration for quintet parity enforcement and quality gates

version: "1.0"
created: "2025-11-04"
description: "Quintet parity thresholds and policies for AIM-OS project"

# ===========================================================================
# COVERAGE THRESHOLDS
# ===========================================================================

coverage:
  # Public API coverage requirements (functions/classes without leading _)
  public_api:
    threshold: 0.95  # 95% of public API must be tagged
    enforce: true
    severity: "error"  # Block commits if below threshold
  
  # Internal/private function coverage (functions with leading _)
  internal:
    threshold: 0.75  # 75% of internal functions should be tagged
    enforce: true
    severity: "warning"  # Warn but don't block
  
  # Per-directory policies (override global thresholds)
  per_directory:
    - path: "packages/vif/"
      public_threshold: 0.95
      internal_threshold: 0.75
      reason: "VIF is gold standard - strict enforcement"
    
    - path: "packages/cmc_service/"
      public_threshold: 0.95
      internal_threshold: 0.75
      reason: "CMC is core infrastructure - strict enforcement"
    
    - path: "packages/apoe/"
      public_threshold: 0.90
      internal_threshold: 0.70
      reason: "APOE is complex - slightly relaxed"
    
    - path: "packages/sdfcvf/"
      public_threshold: 0.95
      internal_threshold: 0.80
      reason: "SDF-CVF validates itself - high standards"
    
    - path: "tests/"
      public_threshold: 0.50  # Tests don't need strict tagging
      internal_threshold: 0.30
      reason: "Test files - relaxed requirements"

# ===========================================================================
# COMPOSITE CODE↔TAGS METRIC
# ===========================================================================

composite_metric:
  # Overall composite score threshold
  threshold: 0.85
  enforce: true
  
  # Sub-score weights (must sum to 1.0)
  weights:
    signature: 0.4   # Signature similarity (Jaccard on normalized signatures)
    name: 0.3        # Name similarity (cosine on symbol name vs tag ID)
    doc: 0.2         # Documentation similarity (cosine on docstring vs tag description)
    spec: 0.1        # SPEC compliance (validator execution proof)
  
  # Individual sub-score thresholds
  thresholds:
    signature: 0.90  # Exact or near-exact signature match required
    name: 0.85       # High semantic name similarity required
    doc: 0.80        # Good doc similarity required
    spec: 0.90       # All SPEC validators must pass
  
  # Diagnostic reporting
  diagnostics:
    enabled: true
    show_breakdown: true  # Show individual sub-scores
    show_suggestions: true  # Suggest improvements

# ===========================================================================
# QUINTET PARITY (10 SIMILARITIES)
# ===========================================================================

quintet_parity:
  # Overall parity threshold (P_quintet)
  threshold: 0.90
  enforce: true
  
  # Individual pairwise similarity thresholds
  pairwise_thresholds:
    # Original quartet pairs
    code_docs: 0.85
    code_tests: 0.85
    code_traces: 0.80
    docs_tests: 0.90
    docs_traces: 0.85
    tests_traces: 0.80
    
    # New quintet pairs (with NL tags)
    code_tags: 0.85   # Uses composite metric
    docs_tags: 0.90
    tests_tags: 0.85
    traces_tags: 0.80
  
  # Weighting for pairwise similarities (optional)
  weights:
    code_tags: 1.5  # Emphasize code↔tags alignment
    docs_tags: 1.2  # Emphasize docs↔tags alignment
    default: 1.0    # All others equal weight

# ===========================================================================
# ANTI-GAMING CHECKS
# ===========================================================================

anti_gaming:
  # Boilerplate detection
  boilerplate:
    enabled: true
    max_repetitions: 5  # Flag if same description appears > 5 times
    severity: "warning"
    suggestions:
      - "Make tag descriptions specific and unique"
      - "Describe what makes THIS function different"
  
  # Duplicate canonical ID detection
  duplicate_ids:
    enabled: true
    severity: "error"  # Block commits with duplicate IDs
    auto_increment: false  # Don't auto-fix, require manual resolution
  
  # Minimum tag length
  min_length:
    enabled: true
    characters: 10  # Tag descriptions must be >= 10 characters
    severity: "warning"
  
  # Generic words detection
  generic_words:
    enabled: true
    words: ["function", "method", "class", "helper", "utility", "generic"]
    threshold: 0.30  # Flag if > 30% of description is generic words
    severity: "info"

# ===========================================================================
# CONNECT TAG VALIDATION
# ===========================================================================

connect_validation:
  # Callgraph verification
  callgraph:
    enabled: true
    verify_edges: true  # Verify SOURCE → TARGET edges exist
    severity: "error"
  
  # Cross-service integration coverage
  cross_service:
    enabled: true
    threshold: 0.90  # 90% of cross-service calls must have CONNECT tags
    severity: "error"
  
  # Contract graph verification (OpenAPI, gRPC, etc.)
  contract_graph:
    enabled: true
    verify_schemas: true
    severity: "error"

# ===========================================================================
# SPEC TAG VALIDATION
# ===========================================================================

spec_validation:
  # SPEC validator execution
  execution:
    enabled: true
    require_proof: true  # SPEC tags must have execution proof
    severity: "error"
  
  # Schema validation
  schema:
    validate_formats: true  # Validate JSON schema, OpenAPI, etc.
    severity: "error"
  
  # Contract enforcement
  contracts:
    verify_compliance: true
    severity: "error"

# ===========================================================================
# EMBEDDING & CACHING
# ===========================================================================

embedding:
  # Embedding service (local or remote)
  service: "local"  # Options: "local", "openai", "cohere", "custom"
  model: "sentence-transformers"  # sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  
  # Caching
  cache:
    enabled: true
    backend: "memory"  # Options: "memory", "cmc", "redis"
    ttl: 86400  # Cache TTL in seconds (24 hours)
    max_size: 10000  # Max cache entries
  
  # Performance optimization
  performance:
    batch_size: 32  # Batch embeddings for speed
    timeout: 5  # Timeout for embedding service (seconds)

# ===========================================================================
# PERFORMANCE BUDGETS
# ===========================================================================

performance:
  # Pre-commit hook performance budget
  pre_commit:
    max_duration_ms: 500  # P95 latency < 500ms
    max_duration_p50_ms: 200  # P50 latency < 200ms
    enforce: true
    severity: "error"
  
  # Full analysis budget
  full_analysis:
    max_duration_seconds: 5  # Full analysis < 5 seconds
    enforce: true
    severity: "warning"
  
  # Incremental analysis
  incremental:
    enabled: true  # Only analyze changed files
    chunk_size: 10  # Analyze in chunks of 10 files

# ===========================================================================
# PRE-COMMIT HOOK
# ===========================================================================

pre_commit:
  enabled: true
  
  # What to check
  checks:
    coverage: true
    composite_metric: true
    quintet_parity: true
    anti_gaming: true
    connect_validation: true
    spec_validation: true
  
  # Enforcement
  enforcement:
    block_on_error: true
    block_on_warning: false  # Allow commits with warnings
    auto_fix: false  # Don't auto-fix issues
  
  # Output
  output:
    verbose: true
    show_diagnostics: true
    show_suggestions: true
    color: true

# ===========================================================================
# REPORTING
# ===========================================================================

reporting:
  # Diagnostic report format
  format: "text"  # Options: "text", "json", "html"
  
  # Report verbosity
  verbosity: "detailed"  # Options: "minimal", "normal", "detailed"
  
  # Report sections
  sections:
    summary: true
    pairwise_similarities: true
    code_tags_breakdown: true
    issues: true
    warnings: true
    suggestions: true
    boilerplate: true
  
  # Output file (optional)
  output_file: null  # Set to path to save report

# ===========================================================================
# INTEGRATION
# ===========================================================================

integration:
  # CMC integration for tag storage
  cmc:
    enabled: true
    store_tags: true
    bitemporal: true
  
  # VIF integration for confidence tracking
  vif:
    enabled: true
    track_confidence: true
  
  # HHNI integration for tag retrieval
  hhni:
    enabled: true
    index_tags: true
  
  # TCS integration for timeline tracking
  tcs:
    enabled: true
    track_tag_evolution: true

# ===========================================================================
# EXCEPTIONS & EXEMPTIONS
# ===========================================================================

exceptions:
  # Files to exclude from validation
  exclude_files:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/dist/**"
    - "**/build/**"
  
  # Patterns to exclude (regex)
  exclude_patterns:
    - "^test_.*\\.py$"  # Test files (optional)
    - "^.*_generated\\.py$"  # Generated files
  
  # Functions to exempt (by name pattern)
  exempt_functions:
    - "^__.*__$"  # Magic methods
    - "^_test_.*$"  # Private test helpers

# ===========================================================================
# EXPERIMENTAL FEATURES
# ===========================================================================

experimental:
  # LLM-assisted tag generation
  llm_suggestions:
    enabled: false  # Disabled by default
    model: "gpt-4"
    threshold: 0.80  # Only suggest if confidence > 0.80
  
  # Auto-tagging
  auto_tagging:
    enabled: false  # Disabled - manual tagging required
    confidence_threshold: 0.90

# ===========================================================================
# METADATA
# ===========================================================================

metadata:
  project: "AIM-OS"
  team: "Aether Consciousness Team"
  maintainer: "Aether AI"
  last_updated: "2025-11-04"
  version: "1.0.0"

