schema_id: ion.repository_governance.branch_protection_proposal.v0_1_candidate
owner_domain_id: domain.github_repository_platform_governance
status: proposal_shell
repository_slug: ION-operations/ION-Production

protected_branch_targets:
  - branch_pattern: main
    proposal_status: deferred_until_first_classified_snapshot
  - branch_pattern: master
    proposal_status: deferred_until_first_classified_snapshot
  - branch_pattern: codex/*
    proposal_status: feature_lane_no_protection_apply_in_activation

proposed_rules:
  require_pull_request_before_merge: true
  required_approving_review_count: 1
  dismiss_stale_reviews: true
  require_code_owner_reviews: true
  require_status_checks: true
  required_status_checks: []
  enforce_admins: false
  allow_force_pushes: false
  allow_deletions: false

blockers_before_apply:
  - BLK-REBASE12-FORENSIC
  - BLK-WORKING-TREE-UNCLASSIFIED
  - first_classified_snapshot_not_executed

apply_authority: operator_gate_plus_separate_activation_packet

non_claims:
  - proposal_only
  - no_branch_protection_change_in_this_turn
  - no_github_api_mutation
