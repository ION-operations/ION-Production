# ---------------------------------------------------------------------------
# 1. UNIFIED TIER MODEL (L0–L6 spine + cluster placement)
# ---------------------------------------------------------------------------
unified_tier_model:
  spine: seven_tiers_L0_through_L6
  structural_spine_cluster_map:
    governance: L0_sovereign_and_constitutional_spine
    memory_context: L1_truth_memory_and_context_substrate
    runtime: L2_runtime_execution_and_economics
    verification: L3_verification_and_adversarial_witness
    interface: L4_interface_membrane_and_communication
    formation_weaving: L5_formation_weaving_and_meta_evolution
  L6_rule: >-
    KNOWLEDGE branches use domain.knowledge.<kebab-branch> ids. They are
    addressable-namespace roots in design space only: no pre-founded member count.
    Activation follows growth-law lazy founding (traffic + dependency evidence).
    Structural specialty families in the architect seat (domain.specialty.*) are
    superseded for synthesis by the commons seat's fourteen domain.knowledge.* branches.
  tier_asymmetries:
    - L0 governs all tiers; only Sovereign governs L0
    - L3 witnesses all tiers including L0; never blocks work (SL-1)
    - L5 may re-charter via receipted formation through L0 law
    - L6 is generative and unbounded in members; L0–L5 enumerable at any moment

# ---------------------------------------------------------------------------
# 2. GOVERNING LAWS (deduplicated once)
# ---------------------------------------------------------------------------
governing_laws:
  SL-1_verification_is_not_authority:
    law: >-
      No structural domain may erect a blocking gate on WORK. Verification is witness.
      Claim gates may refuse a sentence as satisfied; they never refuse execution.
      Unratified gates default to witness (rs0q2oku precedent).
  SL-2_no_solicited_ratification:
    law: Agents never solicit ratification, approval, or blessing from the human.
  SL-3_escalation_triggers_closed_set:
    law: >-
      Human escalation only for (a) removing Sovereign-designed fundamentals,
      (b) real money, (c) beyond ION capability. All else self-routes.
  design_vs_activation:
    law: >-
      Full web may be DESIGNED in breadth; FOUNDED when quartet exists on disk;
      ACTIVATED only via E1 seven-step path under F6 necessity pressure.
      Design confers zero invocability. Necessity never forbids design.
    state_ladder: [DESIGNED, FOUNDED, ACTIVATED, PROMOTED]
  F6_mitosis_under_necessity:
    law: >-
      Growth by mitosis under necessity pressure, never by quota. Topology pressure
      may be reported; topology mutation requires lifecycle receipts.
  commons_context_template_law:
    law: >-
      Every knowledge branch instantiates AGENT_CONTEXT_PACKAGE skeleton; commons
      owns SHAPE/SHARING; template_and_protocol_movement owns CHANGE;
      context_systems owns COMPILE/MOUNT; promotion pipeline is witness-only.
  anti_patterns: [AP1_speculative_mass_founding, AP2_gate_manufacturing, AP3_borrowed_authority, AP4_fishing_for_growth, AP5_design_activation_conflation, AP6_parent_only_settlement_rows]
  claim_vs_work_gate:
    law: >-
      Work gates unlawful. Claim gates lawful on sentences only. Domain
      claim_gate_and_witness_verification owns classification of all registered gates.

