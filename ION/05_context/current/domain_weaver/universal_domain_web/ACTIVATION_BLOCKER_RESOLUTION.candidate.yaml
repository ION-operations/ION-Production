    parent_domain_id domain.sos_state_machine_and_transition_law; UNREGISTERED_PACKAGE_DISPOSITION
    parent_domain_id_mismatch_note routes correction toward SOS parent, not ion_system_definition apex.
  ion_system_definition_role: >-
