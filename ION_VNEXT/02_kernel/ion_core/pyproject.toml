[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-kernel-vnext-control"
version = "0.0.0"
description = "ION vNext dependency-closed control surface candidate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests/control"]
pythonpath = ["src"]
addopts = "-q"
