template_ref: .ion/candidate_deliverables/GIT_SNAPSHOT_PRECOMMIT_GATE.template.candidate.yaml
specified_at: "2026-07-26T00:16:00Z"
carrier: cursor_agent
model: composer-2.5
terminal_verdict: FIRST_GIT_SNAPSHOT_PRECOMMIT_GATE_SPEC_READY

repository_binding:
  shell_root: /home/sev/ION - Production/ION_Developement
  git_toplevel_must_equal: /home/sev/ION - Production/ION_Developement
  workspace_root: /home/sev/ION - Production
  remote_name: origin
  remote_url: https://github.com/ION-operations/ION-Production.git
  source_branch: codex/ion-custom-gpt-front-door-carrier-v4
