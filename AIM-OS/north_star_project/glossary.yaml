# North Star Document — Glossary (v2)

terms:
  atom:
    definition: Smallest persistent memory unit (content + tags + metadata + provenance) created by CMC.
    synonyms: [memory atom]
  gate:
    definition: Verifiable condition required to accept work (e.g., word count within tolerance, examples run, sources cited).
    categories: [pre_chapter, word_count, technical, integration]
  tier_a_source:
    definition: Authoritative reference specified by the chain spec or goal tree (validated system docs, spike summaries, acceptance artifacts).
    synonyms: [Tier A]
  contradiction:
    definition: Claim that conflicts with another evidenced claim or policy; merge is blocked until reconciled.
  kappa_gating:
    definition: Policy‑driven confidence thresholds (κ) that route low‑confidence steps to research, tests, or review.
    synonyms: [κ‑gating, confidence gating]
  chat_ide:
    definition: The combined conversational + editor interface where artifacts, tools, gates, and evidence live together.
    synonyms: [Chat/IDE]
  
  # Part II - Foundation Systems
  cmc:
    definition: Context Memory Core - Immutable atom storage system providing durable memory with provenance tracking.
    synonyms: [Context Memory Core]
  hhni:
    definition: Hierarchical Hypergraph Neural Index - Layered retrieval system that keeps context tight yet complete through hierarchical navigation.
    synonyms: [Hierarchical Index]
  vif:
    definition: Verifiable Intelligence Framework - Confidence routing system that directs work below 0.70 to research or validation steps.
    synonyms: [Verifiable Intelligence]
  apoe:
    definition: AI-Powered Orchestration Engine - Executable chains and policies that turn intentions into reproducible procedures.
    synonyms: [Orchestration Engine]
  seg:
    definition: Semantic Evidence Graph - Evidence anchors and contradiction detection so every claim can be audited.
    synonyms: [Evidence Graph]
  sdf_cvf:
    definition: Atomic Evolution Framework - Quality validation system ensuring quartet parity and maintaining quality standards.
    synonyms: [SDF-CVF, Quality Framework]
  
  # Part III - Consciousness Systems
  cas:
    definition: Capability Awareness System - Self-awareness sensors monitoring thought patterns, drift, capability readiness, and trust.
    synonyms: [Capability Awareness System, Self-Awareness]
  sis:
    definition: Self-Improvement System - System that turns observations into action through improvement dreams, experimentation, and learning integration.
    synonyms: [Self-Improvement System]
  ccs:
    definition: Continuous Consciousness Substrate - System that unifies foreground, background, and meta-consciousness through a five-layer stack.
    synonyms: [Continuous Consciousness Substrate, Substrate Trinity]
  mige:
    definition: Memory-to-Idea Growth Engine - System that transforms memory into actionable ideas through BTSM and HVCA processes.
    synonyms: [Memory-to-Idea Growth Engine, Idea Growth Engine]
  ard:
    definition: Autonomous Research Dream - System enabling recursive self-improvement through research-grounded dreams and safe testing.
    synonyms: [Autonomous Research Dream]
  
  # Consciousness Terms
  foreground:
    definition: Active dialogue consciousness mode (Chat AI) that executes plans and surfaces results to users.
    synonyms: [Chat AI]
  background:
    definition: Organizer AI consciousness mode that tags, weights, and organizes streams in parallel; maintains situational awareness.
    synonyms: [Organizer AI]
  meta_consciousness:
    definition: Audit AI consciousness mode that verifies organization quality, detects drift, and directs improvements.
    synonyms: [Audit AI, Meta-Consciousness]
  bitemporal:
    definition: Temporal tracking system maintaining both valid-time (when event occurred) and transaction-time (when recorded) for perfect temporal consistency.
    synonyms: [Bitemporal Synchronization]
  
  # Part IV-VII Terms
  dynamic_specialization:
    definition: System that matches the right persona to each task by combining domain tags, authority, capability proof, and live performance metrics.
    synonyms: [Specialization]
  authority_map:
    definition: Unified authority tiers aligning HHNI depth, persona selection, capability routing, and governance dashboards.
    synonyms: [Authority Map Integration]
  capability_ledger:
    definition: Proof availability system for capabilities; validates expertise and enables capability-based routing.
    synonyms: [Capability Ledger]
  readiness_score:
    definition: Composite score combining capability freshness, authority, performance quality, and load factor; drives persona selection.
    synonyms: [Readiness]
  
  # Quality & Security Terms
  quartet_parity:
    definition: Quality validation ensuring code, tests, documentation, and evidence are all present and aligned.
    synonyms: [Quartet Parity]
  ece:
    definition: Expected Calibration Error - Metric measuring how well confidence scores match actual accuracy.
    synonyms: [Expected Calibration Error]
  captok:
    definition: Capability Token - Security mechanism controlling tool access based on capability proofs and authority tiers.
    synonyms: [Capability Token, CapTok]
  differential_privacy:
    definition: Privacy-preserving technique adding calibrated noise to protect sensitive information while maintaining utility.
    synonyms: [DP, Differential Privacy]
  
  # Mathematical Terms
  learning_rate:
    definition: Rate of improvement per unit time (typically per month); measures how quickly system improves.
    synonyms: [Improvement Rate]
  adaptation_rate:
    definition: Speed at which improvements are successfully integrated; measures improvement integration efficiency.
    synonyms: [Adaptation Efficiency]
  drift_detection:
    definition: Process of identifying when system behavior deviates from expected baselines or quality standards.
    synonyms: [Drift Detection]
  
  # Benchmark Terms
  benchmark_suite:
    definition: Comprehensive set of benchmarks validating system effectiveness across multiple dimensions (learning, quality, performance).
    synonyms: [Benchmarks]
  research_grounding:
    definition: Percentage of improvement dreams backed by Tier A sources; validates research quality.
    synonyms: [Research Grounding]
  dream_success_rate:
    definition: Percentage of tested improvement dreams that show measurable improvement; validates dream quality.
    synonyms: [Dream Success Rate]

