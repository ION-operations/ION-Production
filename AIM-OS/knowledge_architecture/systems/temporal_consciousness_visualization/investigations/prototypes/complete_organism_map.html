<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #ffffff;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #graph {
            width: 100%;
            height: 100%;
        }
        
        /* UI Controls */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }
        
        #controls h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #3498db;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #95a5a6;
        }
        
        input[type="range"] {
            width: 100%;
        }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        /* Stats Panel */
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
        }
        
        #stats h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #3498db;
        }
        
        #stats .stat {
            font-size: 12px;
            margin: 5px 0;
            color: #ecf0f1;
        }
        
        #stats .stat strong {
            color: #3498db;
        }
        
        /* Legend */
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #3498db;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
            font-size: 11px;
        }
        
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        
        /* Details Panel */
        #details {
            position: absolute;
            top: 20px;
            right: 250px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }
        
        #details.visible {
            display: block;
        }
        
        #details h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #3498db;
        }
        
        #details .detail-section {
            margin: 15px 0;
        }
        
        #details .detail-label {
            font-size: 11px;
            color: #95a5a6;
            margin-bottom: 3px;
        }
        
        #details .detail-value {
            font-size: 13px;
            color: #ecf0f1;
        }
        
        /* Nodes */
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .node:hover {
            stroke-width: 3px;
            filter: brightness(1.3);
        }
        
        .node.selected {
            stroke: #ffffff;
            stroke-width: 4px;
        }
        
        /* Links */
        .link {
            stroke-opacity: 0.6;
            transition: all 0.3s ease;
        }
        
        .link:hover {
            stroke-opacity: 1;
            stroke-width: 3px;
        }
        
        /* Labels */
        text {
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            font-size: 10px;
            fill: #ffffff;
            text-shadow: 0 0 3px #000000, 0 0 3px #000000;
        }
        
        /* Search */
        #search-container {
            margin-bottom: 15px;
        }
        
        #search-input {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 5px;
            font-size: 12px;
        }
        
        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        document.querySelectorAll('.layer-filter').forEach(checkbox => {

                if (e.target.checked) {
                    layerFilters.add(layer);

                    layerFilters.delete(layer);

            });
        });
        
        document.querySelectorAll('.type-filter').forEach(checkbox => {

                }

            const found = data.nodes.find(n =>
