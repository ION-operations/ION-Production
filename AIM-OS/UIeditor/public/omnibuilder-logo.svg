<?xml version="1.0" encoding="UTF-8"?>
<!--
  OmniBuilder Logo — "The Convergence" v2
  A radiant nexus where all dimensions of design meet: color, form, code, light.
  Masterpiece SVG — zero raster dependencies.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- ═══ Petal Gradients — rich jewel tones ═══ -->

    <!-- Violet / Indigo -->
    <radialGradient id="g1" cx="0.3" cy="0.3" r="0.7" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#5b21b6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose / Crimson -->
    <radialGradient id="g2" cx="0.3" cy="0.3" r="0.7" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#e11d48" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#9f1239" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1c0a12" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber / Gold -->
    <radialGradient id="g3" cx="0.3" cy="0.3" r="0.7" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#92400e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1c1507" stop-opacity="0"/>
    </radialGradient>

    <!-- Lime / Emerald -->
    <radialGradient id="g4" cx="0.3" cy="0.3" r="0.7" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#65a30d" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#3f6212" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f1a08" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal / Cyan -->
    <radialGradient id="g5" cx="0.3" cy="0.3" r="0.7" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#155e75" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a1a1f" stop-opacity="0"/>
    </radialGradient>

    <!-- Electric Blue -->
    <radialGradient id="g6" cx="0.3" cy="0.3" r="0.7" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.94"/>
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#1e40af" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#0c1524" stop-opacity="0"/>
    </radialGradient>

    <!-- Center nexus -->
    <radialGradient id="nexus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="5%" stop-color="#f8fafc" stop-opacity="0.98"/>
      <stop offset="15%" stop-color="#e0e7ff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#a5b4fc" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm center glow -->
    <radialGradient id="warm-glow" cx="0.5" cy="0.5" r="0.35">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer atmosphere -->
    <radialGradient id="atmosphere" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#1e1b4b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.03"/>
    </radialGradient>

    <!-- Geometric overlay -->
    <linearGradient id="geo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="f1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="f2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="f3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="f4" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <!-- Circle clip -->
    <clipPath id="cc">
      <circle cx="256" cy="256" r="225"/>
    </clipPath>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="512" height="512" fill="#030306"/>

  <!-- Atmosphere -->
  <circle cx="256" cy="256" r="245" fill="url(#atmosphere)"/>

  <!-- ═══ MAIN COMPOSITION ═══ -->
  <g clip-path="url(#cc)">
    <circle cx="256" cy="256" r="225" fill="#060610"/>

    <!-- ═══ DEEP ATMOSPHERE GLOW — ultra-soft underlayer ═══ -->
    <g filter="url(#f4)" opacity="0.45">
      <polygon points="256,256 100,0 20,80" fill="#7c3aed"/>
      <polygon points="256,256 400,0 490,100" fill="#dc2626"/>
      <polygon points="256,256 510,240 500,370" fill="#ca8a04"/>
      <polygon points="256,256 430,470 300,510" fill="#16a34a"/>
      <polygon points="256,256 100,500 10,380" fill="#0891b2"/>
      <polygon points="256,256 0,180 15,300" fill="#2563eb"/>
    </g>

    <!-- ═══ PRIMARY COLOR PETALS ═══ -->
    <!-- 6 triangular rays radiating from center, 60° apart -->

    <!-- Petal 1: Violet — 300° (upper-left) -->
    <g filter="url(#f1)" opacity="0.92">
      <polygon points="256,256 85,25 15,115" fill="url(#g1)"/>
      <polygon points="256,256 15,115 0,200" fill="url(#g1)" opacity="0.65"/>
    </g>

    <!-- Petal 2: Rose — 0° (upper-right) -->
    <g filter="url(#f1)" opacity="0.92">
      <polygon points="256,256 370,20 460,90" fill="url(#g2)"/>
      <polygon points="256,256 285,5 370,20" fill="url(#g2)" opacity="0.75"/>
    </g>

    <!-- Petal 3: Gold — 60° (right) -->
    <g filter="url(#f1)" opacity="0.88">
      <polygon points="256,256 500,195 510,330" fill="url(#g3)"/>
      <polygon points="256,256 460,90 500,195" fill="url(#g3)" opacity="0.45"/>
    </g>

    <!-- Petal 4: Green — 120° (lower-right) -->
    <g filter="url(#f1)" opacity="0.9">
      <polygon points="256,256 440,440 330,500" fill="url(#g4)"/>
      <polygon points="256,256 510,330 440,440" fill="url(#g4)" opacity="0.5"/>
    </g>

    <!-- Petal 5: Teal — 180° (lower-left) -->
    <g filter="url(#f1)" opacity="0.92">
      <polygon points="256,256 120,480 15,390" fill="url(#g5)"/>
      <polygon points="256,256 200,510 120,480" fill="url(#g5)" opacity="0.65"/>
    </g>

    <!-- Petal 6: Blue — 240° (left) -->
    <g filter="url(#f1)" opacity="0.9">
      <polygon points="256,256 0,200 5,340" fill="url(#g6)"/>
      <polygon points="256,256 5,340 15,390" fill="url(#g6)" opacity="0.55"/>
    </g>

    <!-- ═══ VOID SEAMS — dark lines between petals ═══ -->
    <g opacity="0.55">
      <line x1="256" y1="256" x2="190" y2="0" stroke="#030306" stroke-width="7" filter="url(#f3)"/>
      <line x1="256" y1="256" x2="460" y2="50" stroke="#030306" stroke-width="6" filter="url(#f3)"/>
      <line x1="256" y1="256" x2="512" y2="260" stroke="#030306" stroke-width="6" filter="url(#f3)"/>
      <line x1="256" y1="256" x2="380" y2="512" stroke="#030306" stroke-width="7" filter="url(#f3)"/>
      <line x1="256" y1="256" x2="50" y2="460" stroke="#030306" stroke-width="6" filter="url(#f3)"/>
      <line x1="256" y1="256" x2="0" y2="150" stroke="#030306" stroke-width="6" filter="url(#f3)"/>
    </g>

    <!-- ═══ WARM CENTER GLOW ═══ -->
    <circle cx="256" cy="256" r="120" fill="url(#warm-glow)"/>
  </g>

  <!-- ═══ GEOMETRIC OVERLAY — the "Builder" precision layer ═══ -->
  <!-- Inner hexagon -->
  <g transform="translate(256,256)" opacity="0.18">
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"
      fill="none" stroke="url(#geo)" stroke-width="1.2"/>
  </g>
  <!-- Middle hexagon rotated -->
  <g transform="translate(256,256) rotate(30)" opacity="0.1">
    <polygon points="0,-138 119.5,-69 119.5,69 0,138 -119.5,69 -119.5,-69"
      fill="none" stroke="url(#geo)" stroke-width="0.8"/>
  </g>
  <!-- Outer hexagon -->
  <g transform="translate(256,256) rotate(15)" opacity="0.05">
    <polygon points="0,-178 154.2,-89 154.2,89 0,178 -154.2,89 -154.2,-89"
      fill="none" stroke="url(#geo)" stroke-width="0.5"/>
  </g>

  <!-- ═══ CENTER NEXUS — the convergence point ═══ -->

  <!-- Large soft glow -->
  <circle cx="256" cy="256" r="90" fill="url(#nexus)" filter="url(#f2)" opacity="0.9"/>

  <!-- Medium halo -->
  <circle cx="256" cy="256" r="45" fill="url(#nexus)" opacity="0.7"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.6"/>

  <!-- Bright inner ring -->
  <circle cx="256" cy="256" r="10" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>

  <!-- Core glow -->
  <circle cx="256" cy="256" r="8" fill="white" opacity="0.15" filter="url(#f3)"/>

  <!-- Core bright point -->
  <circle cx="256" cy="256" r="5" fill="#ffffff" opacity="0.98"/>
  <circle cx="256" cy="256" r="2.5" fill="#ffffff"/>

  <!-- Starburst micro-rays -->
  <g opacity="0.5" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round">
    <line x1="256" y1="239" x2="256" y2="247"/>
    <line x1="256" y1="265" x2="256" y2="273"/>
    <line x1="239" y1="256" x2="247" y2="256"/>
    <line x1="265" y1="256" x2="273" y2="256"/>
    <!-- Diagonal rays -->
    <line x1="244" y1="244" x2="249.5" y2="249.5"/>
    <line x1="262.5" y1="262.5" x2="268" y2="268"/>
    <line x1="268" y1="244" x2="262.5" y2="249.5"/>
    <line x1="249.5" y1="262.5" x2="244" y2="268"/>
  </g>

  <!-- ═══ VIGNETTE — smooth edge fade ═══ -->
  <circle cx="256" cy="256" r="230"
    fill="none" stroke="#030306" stroke-width="35" opacity="0.65"/>
  <circle cx="256" cy="256" r="245"
    fill="none" stroke="#030306" stroke-width="25" opacity="0.85"/>
  <circle cx="256" cy="256" r="255"
    fill="none" stroke="#030306" stroke-width="15"/>

  <!-- ═══ SUBTLE BOUNDARY CIRCLES ═══ -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>

</svg>
