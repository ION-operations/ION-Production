historical_truth:
  - Browser DOM perception work already exists in kernel calibration, screen automation, extension runtime bridge, probe snapshots, and the JOC DOM twin.
  - The role is being promoted as a bounded support specialist because the work needs a native ION owner, not because it grants browser or ChatGPT authority.
