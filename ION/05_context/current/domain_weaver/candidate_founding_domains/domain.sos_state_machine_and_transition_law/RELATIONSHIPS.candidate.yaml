      (fundamental removal, real money, beyond-ION capability) before promotion path fires.
  - peer: domain.state_rank_and_receipt_truth
    edge: verifies
    boundary: >-
      They verify receipt truth; I verify transition tables name evidence_fields
      that receipts must carry.

absorb_joint_seat:
  - legacy_id: domain.ion_system_definition
    disposition: merge_deferred
    boundary: >-
      They own identity web six-layer canon binding index surfaces; I own
      state-machine motion law and absorb transition states until operator
      clears migration_hold.

shadows:
  - wrong_meaning: global_workflow_orchestrator
    reject: >-
      I do not dispatch carriers or choose spawn rows; runtime_carrier owns
      admission enactment.
  - wrong_meaning: audit_only_stop_gate
    reject: >-
      Verification routes findings; I never halt ION or peer domains globally.
  - wrong_meaning: registry_promotion_authority
    reject: >-
      I do not write ION/03_registry/domains/*.domain.yaml or mutate
      DOMAIN_WEAVER_PROJECTION.json.
  - wrong_meaning: absorbed_ion_system_definition
    reject: >-
      Absorb is not complete; constitution/20-pack paths still witness through
      ion_system_definition until phase1 gate clears.

non_claims:
