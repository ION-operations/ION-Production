schema_id: ion.ai_git_branch_receipt.v0_1
receipt_id: <branch_start_receipt_id>
receipt_type: start
created_at: <iso8601_utc>
agent: <agent_or_carrier>
objective: <objective>
branch:
  name: ion/<agent>/<branch-node>/<objective>/<stamp>
  base_ref: <base_ref>
  base_commit: <base_commit_sha>
  worktree_path: <external_worktree_path>
  branch_node_path: <repo_relative_branch_node>
  protected_branch: false
  isolated_worktree: true
context_surfaces:
  readme: <README.md path inspected>
  agents_md: <AGENTS.md path inspected>
  ion_context_capsule: <ION_CONTEXT_CAPSULE.yaml path inspected>
  receipts: []
checks:
  - name: protected_branch_guard
    passed: true
  - name: main_checkout_clean
    passed: <true|false|unknown>
authority:
  production_authority: false
  live_execution_authority: false
  protected_branch_write: false
  operator_approval: false
verdict: allow_edit
missing_proof: []
