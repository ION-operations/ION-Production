    design_vs_activation:
      field_name: f6_posture
      type: enum
      enum_values:
        - design_only
        - traffic_shaped_active
        - retired_candidate
      law_ref: Constitution F6 — design breadth lawful; activation requires traffic-shaped necessity
      value_semantics:
        design_only: >-
          Node is designed or rostered only; confers zero invocability. Applies to designed_not_materialized
          rows and lawful breadth under tier.knowledge_specialty_frontier without live package.
        traffic_shaped_active: >-
          Node has a live domain package on the measured surface and/or admitted drain with necessity
          evidence; not a ratification or accepted-state claim.
        retired_candidate: >-
          Merge target, demotion alias, or supersession candidate; no new activation without lifecycle receipt.
    node_record_required_fields:
      - id
      - f6_posture
      - disposition
      - charter
    node_record_optional_fields:
      - owns_fundamentals
      - subdomains
      - parent
      - merge_into
      - placement_note
      - severity
      - note
      - proposed_true_set_priority
      - proposed_true_set_class
    applies_to_hierarchy_blocks:
      - live_domains
      - designed_not_materialized
      - subdomain_detail
      - materialized_but_not_on_the_live_45
    default_inference_hints:
