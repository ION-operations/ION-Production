# ===========================================================================
# 4. THE SPINE - the 18 fundamentals that must never be forgotten
# ===========================================================================
the_spine:
  definition: 'All load_bearing_rank 1 and the rank-2 fundamentals without which a rank-1 cannot be honored.'
  ordering: 'Dependency order. Each rung assumes the ones above it.'
  headline_number: >-
    13 fundamentals are rank 1. ONE of them is implemented (CF-11). Eight are partial, four are not
    implemented at all. Re-scored 2026-08-08: rank-1 implemented counts unchanged; receipt and
    carrier-integration evidence strengthened for CF-02 and CF-10 without closing ledger or
    template-context gaps.

  rungs:

    - order: 1
      id: CF-01
      name: 'F0 - Externalization'
      rank: 1
      what_breaks_without_it: >-
        There is no ION. Every session starts from nothing; the project is a sequence of unrelated
        chats with a folder attached.
      implemented: partial
      honest_note: >-
        Continuity is currently carrier-bound. Three entry points disagree about where a new agent
        starts: CLAUDE.md:10 points at the working seat manifest, AGENTS.md:30-40 points at a
        53-day-stale surface, and START_HERE_FOR_ANY_AGENT.md points nowhere.

    - order: 2
      id: CF-02
      name: 'F1 - Receipted truth'
      rank: 1
      what_breaks_without_it: >-
        ION cannot tell a claim from a fact. Documents claim green over work that never ran. This is
        the reason the seat law is "verify, don't trust" rather than "read the status file".
      implemented: partial
      honest_note: >-
        Receipt machinery exists in pieces. 2026-08-08: autonomous loop steward integration and first
        candidate_to_accepted_promotion chain exercised on disk (see CF-02 evidence). No single
        hash-chained organism ledger. The owning domain's own record admits continuity ledgers store
        the INPUT hash, not a post-write hash to resume from - so you cannot rebuild from them.

    - order: 3
      id: CF-03
      name: 'F2 - Self-distrust'
      rank: 1
      what_breaks_without_it: >-
        ION's own stale output re-enters as canon. This is the documented mechanism of the lost year.
      implemented: partial
      honest_note: >-
        The .candidate.* convention is the working half. The missing half is machine classification on
        re-entry: stale POINTERS are detected, stale STATE is not.

    - order: 4
      id: CF-12
      name: 'Directive scope and satisfaction condition'
      rank: 1
      what_breaks_without_it: >-
        A temporary instruction becomes a permanent default and nobody can find out why. Measured
        cost: a Sovereign audit-scoped read-only order silently became the kernel default and
        produced roughly 875 domain runs of nothing over about a year.
      implemented: 'no'
      honest_note: >-
        NOT IMPLEMENTED, and its owning domain, domain.sovereign_intent_and_mandate_ledger, is
        designed but not materialized. This fundamental appears NOWHERE in the constitution. It is
        the clearest single case of a rank-1 fundamental that received zero constitutional text.

    - order: 5
      id: CF-09
      name: 'F5 - Earned agency'
      rank: 1
      what_breaks_without_it: >-
        Any agent can declare itself authorized. Authority collapses to self-report and an agent
        converts encouragement into ratification.
      implemented: partial
      honest_note: >-
        Proof gates are real at spawn and at return. The countervailing path is real too: witness
        demotion can accept a return that failed strict proof, so the same return has two possible
        fates depending on gate ratification state.

    - order: 6
      id: CF-10
      name: 'Verification is not authority - never a global ION blocker'
      rank: 1
      what_breaks_without_it: >-
        Checks become halts and the organism stops itself. The founding failure of the project.
      implemented: partial
      honest_note: >-
        Law is stated in five places across four sectors. Kernel enforcement exists (CF-11). 2026-08-08:
        steward integrate on scheduled autonomous loop tick accepts integration (steps_integrated 1).
        Practice does not match: a carrier-workflow blocked signal is still used as a parent stop
        signal, and the owning domain is not materialized.

    - order: 7
      id: CF-11
      name: 'Unratified gates must not block'
      rank: 1
      what_breaks_without_it: >-
        Gate austerity is prose and any agent can re-invent the blocker that cost the year.
      implemented: 'yes'
      honest_note: >-
        THE ONLY FULLY IMPLEMENTED RANK-1 FUNDAMENTAL. Verified by execution: 9 gates in the
        registry, 0 hard-effective. kernel.ion_gate_registry.gate_may_block and
        demote_evaluation_to_witness are live code with a passing check behind them.

    - order: 8
      id: CF-04
      name: 'F4 - Typed action (the template fundamental)'
      rank: 1
      what_breaks_without_it: >-
        No act has a declared shape, proof obligation, path boundary, or authority ceiling. Every
        write is unbounded and no return can be checked against anything. Untyped cognition - the
        free-form narration that quietly becomes canon in every chat-based workflow - becomes state.
      implemented: 'partial - FORM ONLY, NOT CONTRACT'
      honest_note: >-
        This is the most important honest finding in this file. Templates are NOT lost, abandoned, or
        disconnected. They are wired in and heavily used - as PROMPT GENERATORS. 5463 artifacts carry
        a package class derived from the agent context package template. What was never built is the
        enforcement half. template_id is a membership token in a hardcoded Python set of six strings,
        decoupled from the template corpus entirely. Two of those six ids name no template file
        anywhere. Verified independently by this steward: 122 files under ION/07_templates/, 43
        kernel modules reference them, 1 opens one (only to lint that template's own wording), and
        ZERO validate a produced artifact against a template. The gate enforces zero of the seven
        clauses F4 names.

    - order: 9
      id: CF-05
      name: 'Template and context are ONE typed transition'
      rank: 1
      what_breaks_without_it: >-
        An agent can hold context without its governing template, and a template without the context
        it requires. Artifacts then RESEMBLE continuity without being RE-INSTANTIABLE - which is
        exactly the condition the Sovereign named when he said there may be no continuity system at
        all.
      implemented: 'no'
      honest_note: >-
        Placed at rank 1 by evidence, not by wish. The evidence for the rank: the constitution states
        it almost word for word at F4, the archaeology calls it the claim with the most exact verbatim
        support anywhere in the corpus, and every downstream context failure traces to it. The
        evidence for "not implemented": the coupling was NEVER ONCE implemented as a machine field.
        An exact-key search across all of ION/ and ION_VNEXT/ for context_routes, context_mounts,
        binds_context, preload_context and required_capsules returns ZERO hits repo-wide. The
        template contract schema defines 17 required fields and not one is context-related - there is
        no slot in which a template could declare its context. Between 2026-04-24 and 2026-06-21 the
        responsibility for declaring context migrated from the template to the domain; the arrow
        reversed. Today the work class selects the template and a separate per-domain file declares
        the context, and neither file references the other.

    - order: 10
      id: CF-06
      name: 'The ContextPackage is the only thing an agent receives'
      rank: 1
      what_breaks_without_it: >-
        Context is whatever the agent happened to read. No two runs of the same work have the same
        inputs; no return is reproducible; a domain can be told to run and produce nothing while
        reporting success.
      implemented: 'no'
      honest_note: >-
        context_compiler.py implements the schema faithfully and is not on the live domain spawn
        path. 0 of 233 live capsules carry tier_1_doctrine or template_spec. The remedy recorded by
        the archaeology is "rewire, do not rebuild".

    - order: 11
      id: CF-07
      name: 'template_spec REQUIRED in the never-dropped tier'
      rank: 1
      what_breaks_without_it: >-
        CF-05 stays prose forever. This one field IS the coupling; without it no amount of doctrinal
        restatement can make the unity machine-checkable.
      implemented: 'no'
      honest_note: >-
        Verified: one functional occurrence in the whole kernel, context_compiler.py:219, on a path
        the live domain spawn does not take. The closest ION ever came to implementing the coupling
        is eight template_spec YAML files under ai_assistant_work/template_specs/ from 2026-05-08, all
        left at "candidate machine-checkable template spec, not accepted canon". None were promoted.

    - order: 12
      id: CF-08
      name: 'F6 - Domain organization and mitosis under necessity'
      rank: 1
      what_breaks_without_it: >-
        ION is a monolith with a doctrine folder. Nothing has an exclusive owner, so everything is
        fixed by hand - which the seat law names as the thing an agent must never do.
      implemented: partial
      honest_note: >-
        45 packages materialized, 37 runner-invocable, 38 registered, 102 folders on disk. 37 of 102
        folders carry all seven artifacts F6 requires for completeness. The kernel does not enforce
        exactly-one-home at runtime.

    - order: 13
      id: CF-13
      name: 'Source governs over projection'
      rank: 1
      what_breaks_without_it: >-
        Every README, status file, and projection becomes a competing authority and there is no rule
        for which wins. "Verify, don't trust" becomes a mood rather than a decidable procedure.
      implemented: partial
      honest_note: >-
        Stated in three doctrine files, enforced by none, and inverted in practice: a policy file
        claims to own the allowed-template-id set while its own provenance field points at the code
        that hardcodes it. The audit calls this pattern the house pattern, not a one-off.

    - order: 14
      id: CF-22
      name: 'MINI/CAPSULE are witness, not primary context authority'
      rank: 2
      what_breaks_without_it: >-
        The organism onboards every new agent from a stale index and CF-03 is violated on every
        session start.
      implemented: partial
      honest_note: >-
        The most-restated law in the entire corpus - seven citations across four sectors - and among
        the most violated. 190 MINI.md and 185 CAPSULE.md files on disk; AGENTS.md still lists them
        as first files to read; the codex_solo surface named as THE continuity recovery rule was last
        written 2026-06-11 and was 53 days stale at audit. Called the single sharpest live
        contradiction found.

    - order: 15
      id: CF-18
      name: 'The anti-pointer law - one file per step'
      rank: 2
      what_breaks_without_it: >-
        A context package degenerates into a reading list and the agent reconstructs whatever it
        likes. This is the failure CF-06 exists to prevent, restated at the step level.
      implemented: partial
      honest_note: >-
        Return-side proof is enforced. Package-side inlining is not: 2603 spawn artifacts embed
        required-reads lists rather than loaded content.

    - order: 16
      id: CF-17
      name: 'Asymmetric visibility'
      rank: 2
      what_breaks_without_it: >-
        Scope becomes a rule the agent is asked to follow rather than a boundary it cannot cross.
        Every scope violation in ION's history is an agent doing more than it was asked because it
        could see more than it needed.
      implemented: 'no'
      honest_note: 'Designed in T03. Absent from the live path, which ships a flat list at full density.'

    - order: 17
      id: CF-14
      name: 'F3 - Governed meaning / naming is load-bearing'
      rank: 2
      what_breaks_without_it: >-
        Ids drift and the domain web silently forks into aliases. The L-prefix tier collision this
        file had to route around is a live instance.
      implemented: partial
      honest_note: >-
        Received the LARGEST share of constitutional text of any fundamental (23.4 percent) and is
        implemented about as well as fundamentals that received a twentieth of that. Text volume did
        not buy implementation.

    - order: 18
      id: CF-16
      name: 'F8 - Honesty as schema'
      rank: 2
      what_breaks_without_it: >-
        Disclaimers become prose an agent can drop, and a candidate artifact reads as accepted state.
      implemented: partial
      honest_note: 'non_claims blocks are near-universal in candidate YAML - one of the genuinely successful fundamentals - but absent from operator-facing surfaces.'

  spine_scorecard:
    rank_1_total: 13
    rank_1_implemented_yes: 1
    rank_1_partial: 8
    rank_1_not_implemented: 4
    rank_1_not_implemented_ids: [CF-05, CF-06, CF-07, CF-12]
    spine_total_18: {implemented_yes: 1, partial: 13, not_implemented: 4}
    the_number_stated_plainly: >-
      Of the 13 fundamentals ION cannot function without, 1 is implemented. The four that are not
      implemented at all are: the template-context unity, the context package as sole input, the
      template_spec field that would join them, and the directive scope-and-expiry rule. Three of
      those four are one mechanism.

  the_templates_verdict:
    question: 'Where does the evidence put templates and the template-context unity?'
    answer: >-
      Rank 1, both of them. CF-04 and CF-05 are placed at rank 1 because every state transition in
      ION must pass through them and because their failure mode is the one the Sovereign independently
      diagnosed. This is not deference to his framing - the archaeology, the continuity audit, and
      this steward's own greps agree, and the constitution's own text supports it almost word for
      word at F4 lines 265-274.
    but_honestly: >-
      Templates are not missing. They are the most-used and least-enforced object in ION. The corpus
      holds 122 template files, 93 of them markdown; 5463 artifacts carry a class derived from one of
      them. The design is alive in the template estate and dead in the runtime. What is missing is
      one comparison step and one schema field - not a rebuild.
    the_single_cheapest_repair_identified_by_evidence: >-
      Add a context field to the template contract schema at
      ION/03_registry/template_metadata_contract_registry.yaml. The archaeology states plainly:
      "This single missing field is why the template-context coupling could never become
      machine-checkable. Every other repair is downstream of it." This file NAMES that repair and
      does not perform it - it belongs to domain.template_and_protocol_movement and
      domain.context_systems.package_compilation jointly, per the co_governs edge in section 3.

# ===========================================================================
# 5. CONTRADICTIONS
# ===========================================================================
contradictions:
  counting_note: >-
    35 contradiction entries appear in the twelve sectors' own contradictions blocks; 48 of the 170
    raw fundamentals additionally carry a contradicted_by field, with heavy overlap. Deduplicated and
    merged with the divergences recorded by the two rebuild audits, 40 distinct contradictions are
    enumerated below. Where two sectors found the same conflict it is ONE entry.
  judgement_rule_applied: >-
    Later dated artifact governs over earlier only when it explicitly corrects; otherwise source
    governs projection (CF-13), kernel behavior governs documentation of kernel behavior, and a
    ratified instrument governs a candidate one. Where none of these decide it, the entry says so.

  entries:

    - id: C-01
      topic: 'Constitutional precedence - three-layer stack'
      side_a: {claim: 'Compressed instrument governs law where conflicts exist; this document governs explanation.', path: 'ION_GPT_STATE/OPERATOR_20PACK_REBUILT/ION_Domain_Constitution/Constitution /ION_CONSTITUTION_FOUNDING_DOCUMENT_V0_10_CANDIDATE_20260710.md', lines: '67-69'}
      side_b: {claim: 'Provisional doctrine bridge making the current operating constitution explicit.', path: 'ION/01_doctrine/SOVEREIGN_CONSTITUTION.md', lines: '16-20'}
      authoritative: side_a
      why: >-
        Side A states its own precedence rule explicitly and side B self-describes as provisional and
        NOT_RATIFIED. Both are candidates, so this is precedence among candidates, not settled law.
      severity: high

