    role: local daemon bridges
    source_posture: promoted_integration_candidate
  systemd:
    role: user service templates
    source_posture: promoted_integration_candidate
  product_packager:
    role: product/package builders
    source_posture: promoted_integration_candidate
  Cursor:
    role: Cursor extension and SDK
    source_posture: promoted_integration_candidate
  dAimon:
    role: dAimon app/agent repo
    source_posture: nested_repo_current
  AIM-OS:
    role: AIM/legacy/adjacent architecture corpus
