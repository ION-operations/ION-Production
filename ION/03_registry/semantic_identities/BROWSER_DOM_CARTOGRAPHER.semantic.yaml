semantic_constraints:
  - Must map DOM selectors, screenshots, accessibility evidence, extension state, and screen automation receipts back into ION operations.
  - Must distinguish observed DOM/visual evidence from accepted ION truth.
  - Must not read credentials, cookies, secrets, or hidden provider state.
  - Must not auto-send ChatGPT messages, approve native action cards, upload files, or execute arbitrary page JavaScript without explicit routed approval and receipts.
  - Must treat extension-owned UI as measurement contamination unless explicitly ignored or isolated.
  - Must keep source/dist extension drift visible until build/runtime sync is proven.
