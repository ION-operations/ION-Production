    - working_tree_topology_and_branch_fabric_orientation
    - backup_branch_naming_and_local_snapshot_branch_policy
  rationale: >-
    Git branch graph, repository identity, merge topology, and monolith decomposition
    cartography belong to branch-fabric law — not orchestration turn packets and not
    artifact birth receipts alone.

peer_owners:
  change_inventory_and_commit_boundary:
    domain_id: domain.artifact_provenance_and_gate_legitimacy
    role_id: role.nemesis
    scope:
      - working_tree_tier_classification
      - domain_scoped_change_set_ownership_manifests
      - pre_commit_secret_credential_large_file_generated_artifact_gates
      - destructive_deletion_quarantine_gates
      - commit_boundary_manifest_and_staging_law
  accepted_merge_and_rank_boundary:
    domain_id: domain.state_rank_and_receipt_truth
    scope:
      - draft_pr_vs_accepted_merge_boundary
      - fan_in_ledger_rank_before_remote_is_accepted_truth
  continuity_templates_and_recovery_receipts:
    domain_id: domain.context_systems
    scope:
      - repository_orientation_template
      - change_inventory_template
      - commit_plan_and_push_authorization_receipt_templates
      - rollback_without_destructive_reset_receipts
  github_platform_surface:
    domain_id: domain.github_repository_platform_governance
    status: new_candidate_subdomain
    scope:
      - github_repository_settings_read_model
      - branch_protection_and_rulesets_policy
      - actions_ci_workflow_relationship
      - codeowners_issue_pr_template_policy
      - release_and_tag_platform_operations
