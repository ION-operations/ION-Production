  - branch_id: codex_queue
    title: Codex Queue
    maturity: v0
    family: codex_queue
    authority_summary: Queue visibility plus confirmation-gated work packet, process-once, reconcile, and duplicate-management routes.
    context_refs:
      - ION/04_packages/kernel/ion_codex_queue_runner.py
      - ION/05_context/current/ACTIVE_CHATGPT_CONNECTOR_CODEX_WORK_QUEUE.json
    suggested_next_calls:
      - route_id: queue_status
      - route_id: worker_status
      - route_id: worker_trace
    oversize_recovery:
      schema_id: ion.branch.oversize_recovery.v0_1
      role: codex_queue_action_response_fallback
      sequential_load_handoff:
        - worker_status
        - worker_trace
        - large_artifact_intelligence.large_file_profile
        - large_artifact_intelligence.large_file_slice_read
      fallback_metadata:
        large_artifact_branch_id: large_artifact_intelligence
        local_intelligence_branch_id: local_intelligence
    compact_response_guidance:
      schema_id: ion.branch.compact_response_guidance.v0_1
      preferred_load_pattern: queue_summary_then_artifact_slice
      summary_routes:
        - queue_status
        - worker_status
      list_routes:
        - worker_trace
      slice_routes:
        - worker_trace
        - large_artifact_intelligence.large_file_slice_read
    routes:
      - route_id: queue_status
        title: Queue status
        summary: Read Codex work queue.
        compact_response_guidance:
          schema_id: ion.route.compact_response_guidance.v0_1
          content_returned: compact_rows
          if_more_context_needed: Use worker_trace or large_artifact_intelligence on run artifact paths.
        mcp_tool: ion_codex_work_queue
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            limit:
              type: integer
          additionalProperties: false
      - route_id: worker_status
        title: Worker live status
        summary: Read Codex worker live status.
        compact_response_guidance:
          schema_id: ion.route.compact_response_guidance.v0_1
          content_returned: compact_status_with_optional_preview
          if_oversized: Retry with include_preview=false, then use worker_trace artifact paths with large_artifact_intelligence.
        mcp_tool: ion_codex_worker_live_status
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            include_preview:
              type: boolean
            preview_target:
              type: string
            max_preview_bytes:
              type: integer
          additionalProperties: false
      - route_id: worker_trace
