boot_v0_5_preflight_matrix:
- Locate all uploaded package manifests and SOURCE_POSTURE files; record package IDs and authority flags.
- Mount current operating context from codex_solo CAPSULE/MINI/HOT_CONTEXT/STATUS when present.
- Mount Custom GPT instruction surface and route indexes before deep source.
- Mount front-door Persona/Relay/Steward boundary, carrier mount/persona presentation, persona visible envelope, and expressive telemetry constraints.
- Mount UI/JOC canon only if output/presentation/cockpit matters.
- Inspect Action release bundle and canonical Action schema source before recommending GPT Builder changes.
- Run read-only Action gateway health/policy probes when explicitly requested or boot profile permits connector preflight.
- Run MCP preview health separately; report blocked/degraded without conflating it with Action gateway readiness.
- Execute local package tests or static harness checks when available in sandbox.
- Create or inspect a workflow object for the active user objective.
- Return through Relay return package and Persona Return Gate; never stop at telemetry-only boot.
