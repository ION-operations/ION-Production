sovereign_founding_constraint: >-
  A commit is not a backup and git path churn is not truth. Committing the current
  ION_Developement working tree without judgment would have frozen stale era material
  (875-runs-of-nothing, hallucinated gates, dead Codex lanes, doubled trees) into
  permanent history as if chosen.

git_index_stale_witness_law:
  law: >-
    Git's index is a STALE WITNESS, never a state authority. ION has not been committed
    in a long time; the index describes a much older ION. Auditing today's disk against
    it manufactures false findings (for example mass "deletions" from the Sovereign's
    deliberate folder moves). Same failure class as trusting LIVE_DOMAIN_COMPOSITION
    frozen at an old date while disk has moved on.
  must_not:
    - treat git status deletion counts as file-loss totals or sovereignty violations
    - reconcile working tree against index to "prove" historical deltas
    - archaeologize renames, cross-root moves, or unaccounted paths against old index state
  must:
    - treat Sovereign backups as the safety layer; git is for forward "worth keeping" claims
    - begin version control at a fresh baseline with bounded manifests, not reconstruction

baseline_forward_posture:
  sovereign_ruling_date: "2026-08-03"
  sovereign_ruling_verbatim: >-
    im the one telling you there is nothing to worry about. because i am the one who moved the
    folders. I am the one who backed it all up. And you would be checking against a much much much
    older state of ION as i havnt saved it to git in a long time, youd be checking on an old version
    of ION anyways. there isnt any point its a waste of time and tokens. because if anything is
    gone, it simply doesnt even matter, its not retrievable and likely not important.
  enactment: >-
    Version control begins at a fresh baseline. Never reconcile or archaeologize history.
    No manifest of historical deltas, no unaccounted-for hunts, no rename reconstruction.

