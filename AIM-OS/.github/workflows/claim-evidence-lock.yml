name: Claim Evidence Lock

on:
  pull_request:
    branches: [main, clean-master]
  push:
    branches: [main, clean-master]
  schedule:
    - cron: "0 6 * * 0" # Weekly Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run full package-suite claim lock (slower)"
        required: false
        default: true
        type: boolean

jobs:
  claim-evidence-quick:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.run_full == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce README claim language policy
        run: python scripts/check_readme_claim_language.py

      - name: Generate quick claim-evidence lock
        run: |
          python scripts/generate_claim_evidence_lock.py \
            --quick \
            --out-dir audit/ci_claim_lock

      - name: Upload quick claim lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-evidence-quick-${{ github.run_id }}
          path: |
            audit/ci_claim_lock/09_CLAIM_EVIDENCE_LOCK.md
            audit/ci_claim_lock/09_CLAIM_EVIDENCE_LOCK.json
          if-no-files-found: warn

  claim-evidence-full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce README claim language policy
        run: python scripts/check_readme_claim_language.py

      - name: Generate full claim-evidence lock
        run: |
          python scripts/generate_claim_evidence_lock.py \
            --out-dir audit/ci_claim_lock_full

      - name: Upload full claim lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-evidence-full-${{ github.run_id }}
          path: |
            audit/ci_claim_lock_full/09_CLAIM_EVIDENCE_LOCK.md
            audit/ci_claim_lock_full/09_CLAIM_EVIDENCE_LOCK.json
          if-no-files-found: warn

