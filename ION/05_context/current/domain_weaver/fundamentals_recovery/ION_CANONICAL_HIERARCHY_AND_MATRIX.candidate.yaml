fundamentals_deduplication_ledger:
  method: >-
    Merged by semantic identity of the STATEMENT, not by id. The same fundamental restated in the
    compressed instrument, the founding document, a kernel module docstring, and a sector report is
    ONE entry carrying all citations.
  largest_merges:
    - {canonical: CF-22, raw_citations: 7, note: 'MINI/CAPSULE demotion - the most-restated law in the corpus'}
    - {canonical: CF-10, raw_citations: 5, note: 'verification is not authority / never a global ION blocker'}
    - {canonical: CF-07, raw_citations: 5, note: 'template_spec REQUIRED in never-dropped tier'}
    - {canonical: CF-08, raw_citations: 6, note: 'F6 domain organization'}
    - {canonical: CF-04, raw_citations: 5, note: 'F4 typed action'}
  raw_entries_not_promoted_to_canonical:
    count: 23
    reason: >-
      Entries whose statement was a file STATUS line rather than a fundamental (for example
      "status: PROPOSED_RESTORATION_NOT_YET_RATIFIED", "status: ACTIVE_OPERATIONAL_LAW",
      "template_id: ion.template.single_carrier_sequential_runtime.v1", "doctrine root:
      ION/01_doctrine/"). These are recorded in section 5 as contradiction evidence rather than as
      fundamentals, because a status field is a fact about an artifact, not a law of the organism.
    also_excluded:
      - 'Coverage-matrix arithmetic ("5/19 fundamentals are COVERED") - a measurement, not a fundamental.'
      - 'Operator verdicts ("ION was never assembled") - judgement, not law.'
      - 'The 21 proposed-but-NOT_RATIFIED Articles 21-41 were reviewed individually; those carrying content not already held by a ratified fundamental were promoted (CF-29, CF-32, CF-42 partially). The remainder are cited inline rather than given their own canonical entries, and are listed in section 5 unresolved.'

