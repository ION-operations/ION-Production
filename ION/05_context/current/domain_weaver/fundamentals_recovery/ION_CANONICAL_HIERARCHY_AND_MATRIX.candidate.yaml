# ===========================================================================
# 6. WHAT THE CONSTITUTION UNDERWEIGHTED
# ===========================================================================
what_the_constitution_underweighted:
  the_sovereign_hypothesis: >-
    "MAYBE EVEN THE LATEST CONSTITUTION DIDNT FULLY CAPTURE HOW IMPORTANT TEMPLATES ARE, LIKELY
    BECAUSE I THOUGHT IT WAS CANON AT THIS POINT."
  restated_as_a_testable_claim: >-
    The constitution's emphasis tracks recency of argument rather than load-bearing importance.
    Things the author considered obviously canon received the least text.
  verdict: CONFIRMED_BY_MEASUREMENT
  confidence: high
  measurement_target: 'ION_GPT_STATE/OPERATOR_20PACK_REBUILT/ION_Domain_Constitution/Constitution /ION_CONSTITUTION_FOUNDING_DOCUMENT_V0_10_CANDIDATE_20260710.md (1116 lines, 9682 words)'
  method: >-
    Word count of each F-section from its heading to the next heading, measured directly. Ranks were
    assigned in section 1 before this measurement was taken, by what breaks without each fundamental.

  evidence_1_text_per_fundamental:
    unit: words in the F0-F8 block (1270 words total)
    rows:
      - {fundamental: F0, canonical: CF-01, name: Externalization,      lines: '207-212', words: 51,  pct: 4.0,  rank: 1}
      - {fundamental: F1, canonical: CF-02, name: 'Receipted truth',    lines: '213-219', words: 51,  pct: 4.0,  rank: 1}
      - {fundamental: F2, canonical: CF-03, name: 'Self-distrust',      lines: '220-233', words: 130, pct: 10.2, rank: 1}
      - {fundamental: F3, canonical: CF-14, name: 'Governed meaning',   lines: '234-264', words: 297, pct: 23.4, rank: 2}
      - {fundamental: F4, canonical: CF-04, name: 'Typed action',       lines: '265-275', words: 91,  pct: 7.2,  rank: 1}
      - {fundamental: F5, canonical: CF-09, name: 'Earned agency',      lines: '276-292', words: 150, pct: 11.8, rank: 1}
      - {fundamental: F6, canonical: CF-08, name: 'Domain organization',lines: '293-309', words: 164, pct: 12.9, rank: 1}
      - {fundamental: F7, canonical: CF-15, name: 'Governed evolution', lines: '310-321', words: 115, pct: 9.1,  rank: 2}
      - {fundamental: F8, canonical: CF-16, name: 'Honesty as schema',  lines: '322-346', words: 221, pct: 17.4, rank: 2}

  evidence_2_the_inversion:
    rank_1_fundamentals_in_the_F_block: {count: 6, ids: [F0, F1, F2, F4, F5, F6], total_words: 637, mean_words: 106.2}
    rank_2_fundamentals_in_the_F_block: {count: 3, ids: [F3, F7, F8], total_words: 633, mean_words: 211.0}
    ratio: 1.99
    finding: >-
      The three rank-2 fundamentals received almost exactly as many words as the six rank-1
      fundamentals - a mean of 211 words each against 106. The constitution spent DOUBLE the text per
      fundamental on the ones ION degrades without, compared to the ones ION cannot run without. The
      inversion is not marginal; it is a factor of two.
    largest_single_inversion: >-
      F3 Governed meaning (rank 2) received 297 words, 23.4 percent of the entire fundamentals block -
      the largest share of any fundamental. F0 Externalization and F1 Receipted truth (both rank 1,
      both axioms everything else stands on) received 51 words each, 4.0 percent - the smallest.
      F3 received 5.8 times the text of the two fundamentals that make ION possible at all.

  evidence_3_templates_specifically:
    f4_share_of_the_fundamentals_block: '7.2 percent - second-smallest of the nine, ahead of only F0 and F1'
    f4_rank: 1
    whole_document_term_frequency:
      note: 'Counts across all 9682 words of the constitution, case-insensitive.'
      receipt: 92
      carrier: 86
      domain: 54
      gate: 50
      truename: 15
      template: 16
      mitosis: 6
      blocker: 2
      'context package (any casing or spelling)': 0
      template_spec: 0
    the_finding_stated_plainly: >-
      The constitution says "receipt" 92 times and "template" 16 times. It says "context package"
      ZERO times - the phrase does not occur anywhere in the document in any casing or spelling. The
      object that F4 declares to be the carrier of every lawful act is named 16 times; the object
      that F4 says must accompany it is never named once.
    why_this_matters_more_than_the_word_count: >-
      The Sovereign's instinct was right and slightly understated. It is not only that templates got
      too little text. It is that the OTHER HALF of the same mechanism - the context package that
      makes a template enforceable - was never written into the constitution at all. That absence is
      the precise reason the coupling could drift for two months without any document registering a
      violation: there was no constitutional sentence for the drift to contradict.

  evidence_4_the_rank_1_fundamentals_the_constitution_never_states:
    note: 'These are rank 1 by what breaks without them, and receive zero constitutional text.'
    rows:
      - id: CF-05
        name: 'Template and context are ONE typed transition'
        constitutional_words: 0
        nearest_constitutional_text: 'Implied inside F4 lines 265-274 - "what context it requires" - 5 words of a 91-word section.'
        measured_cost_of_absence: 'The coupling was never implemented as a machine field. Every artifact ION produces can resemble continuity without being re-instantiable.'
      - id: CF-06
        name: 'The ContextPackage is the only thing an agent receives'
        constitutional_words: 0
        nearest_constitutional_text: 'None. The phrase does not appear in the constitution. It lives only in a DRAFT spec dated 2026-04-03.'
        measured_cost_of_absence: '0 of 233 live capsules implement the schema. No two runs of the same work have the same inputs.'
      - id: CF-07
        name: 'template_spec REQUIRED in the never-dropped tier'
        constitutional_words: 0
        nearest_constitutional_text: 'None. The token template_spec appears 0 times.'
        measured_cost_of_absence: 'One functional occurrence in the entire kernel, on a path the live spawn does not take.'
      - id: CF-12
        name: 'Every directive carries a scope and a satisfaction condition'
        constitutional_words: 0
        nearest_constitutional_text: 'None. "expiry" appears 0 times; "satisfaction condition" appears 0 times; "scope" appears 7 times, never about directives.'
        measured_cost_of_absence: 'Roughly 875 domain runs of nothing over about a year. The largest measured cost of any single gap in this file.'
      - id: CF-10
        name: 'Verification is not authority - never a global ION blocker'
        constitutional_words: 0
        nearest_constitutional_text: '"blocker" appears twice in 9682 words; the phrase "never a global ION blocker" appears 0 times. It is stated in a workbench DOMAIN_REGISTRY.md, in CLAUDE.md, and in roundtable logs - never in the constitution.'
        measured_cost_of_absence: 'The founding failure of the project. Its executable form CF-11 is the single implemented rank-1 fundamental, and it was written in the kernel rather than in the constitution.'
    subtotal: >-
      5 of the 13 rank-1 fundamentals receive ZERO constitutional text. Together they account for all
      four of the completely unimplemented rank-1 fundamentals, plus the anti-blocker law whose
      violation cost the year.

  the_answer_to_the_sovereign:
    confirmed: >-
      Yes. The measurement supports the hypothesis and extends it. Constitutional text volume is
      inversely related to load-bearing rank by a factor of two among the fundamentals that were
      written down, and the five most consequential mechanisms were not written down at all.
    the_sharper_version_of_his_insight: >-
      He said the constitution may not have captured how important templates are, because he thought
      it was canon. The measurement says something more specific: F4 IS in the constitution, stated
      well, in 91 words. What is missing is not the template. It is the OTHER HALF - the context
      package, the template_spec field, and the sentence that binds them into one transition. He was
      right that something was assumed rather than argued, and the thing assumed was the join.
    why_the_assumed_things_were_written_least:
      mechanism: >-
        A constitution is written to settle live arguments. F3 Governed meaning received 23.4 percent
        of the text because true-naming was contested at the time of writing. F0 and F1 received 4.0
        percent each because nobody was arguing with them. Nothing in the drafting process
        distinguished "settled because obvious" from "settled because unimportant", so both got
        short sections. Load-bearing rank was never an input to the document's structure.
      corroborating_evidence_from_the_corpus: >-
        The archaeology finds the template contract schema was defined on 2026-04-24 with 17 required
        fields and zero context fields - "which is why the coupling could never become machine-checkable
        no matter how strongly doctrine restated it". Four days later the arrow reversed: the context
        system acquired a primary_templates list, and no template anywhere acquired a corresponding
        primary_context field. The drift happened in schemas, silently, while the doctrine kept
        restating the unity. Nobody was arguing about it, so nobody wrote it down, so no schema had a
        slot for it.
      the_structural_lesson: >-
        This artifact ranks by consequence rather than by how much was said, which is the only
        correction that prevents the same loss. A future constitution should carry the rank field
        beside each fundamental, and the rank should be derived from what breaks, not from what was
        recently argued.
    what_would_have_prevented_the_year: >-
      CF-12. A single required field recording the scope and satisfaction condition of every operator
      directive. It is not in the constitution, it is not implemented, and its owning domain is not
      materialized. Of everything in this file, that is the cheapest unbuilt thing with the largest
      measured cost.

