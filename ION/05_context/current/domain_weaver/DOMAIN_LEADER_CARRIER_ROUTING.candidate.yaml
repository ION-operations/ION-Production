schema_id: ion.domain_leader_carrier_routing.v0_7_candidate
posture: candidate_only
updated_at: '2026-07-23T03:25:00Z'
operator_note: Model tiers decouple from CLI subscription limits. Any carrier offering
  an equivalent model may serve a tier; cursor_cli is the universal-access lane for
  leader-tier equivalents (rules/skills/hooks matched with ION). Carrier choice between
  CLIs offering the same model uses infrastructure fit and health, not exclusive CLI
  availability. Cross-carrier tier equivalents precede composer quality downgrade.
  Codex CLI uses GPT-5.6 Sol with max reasoning for consequential lead work; Claude
  CLI uses Opus 4.8 and Sonnet 5; Cursor CLI defaults remain Composer 2.5 and Composer
  2.5 Fast. Sparse non-leader experiment roster (gemini, grok) stays explicit-request-only.
  Ordinary in-chat Codex/GPT subagents are forbidden; execution uses bounded ION CLI
  carriers.
operator_law_verbatim: but codex/claude cli usage are irrelavent. cursor cli has all
  of those models and more available. There should not be a claude usage it is a claude
  CLI suage limit but there are other emans of access those same models. the only
  things is insuring the CLI and their unique infastructure like rules/skills etc
  are correctly matched with ION.
model_access_law:
  decouple_subscription_from_model_tier: true
  cursor_cli_universal_access_lane: true
  cross_carrier_equivalent_before_quality_downgrade: true
  carrier_selection_basis:
  - infrastructure_fit
  - health
  - availability
  infrastructure_fit:
    cursor_cli:
    - cursor_rules
    - cursor_skills
    - cursor_hooks
    - ion_carrier_mount
    claude_cli:
    - claude_cli_runner
    - ion_mount
    codex_cli:
    - codex_agent_mount
    - ion_mount
default_carrier: cursor_cli
leader_carrier: claude_cli
universal_access_carrier: cursor_cli
leader_domains:
- domain.runtime_carrier_and_action_admission
- domain.model_routing_and_reasoning_economics
- domain.domain_weaver_living_self_model
- domain.swarm_scale_scheduling_and_workload_economics
