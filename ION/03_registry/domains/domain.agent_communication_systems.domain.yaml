open_edges:
  - Room and contact contracts are operational substrate; they do not grant accepted-state, production, live execution, or secrets authority.
  - Agents decide when to contact each other; automation validates limits, carries packets, starts governed workers, and writes machine receipts.
  - Direct rooms must report decisions or blockers back to a visible team or mission room when relevant.
