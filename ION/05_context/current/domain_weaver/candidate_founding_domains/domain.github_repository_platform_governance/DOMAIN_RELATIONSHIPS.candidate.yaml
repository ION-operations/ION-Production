      - ION/05_context/current/repository_governance/REPOSITORY_STATE_SUMMARY.candidate.md

  - edge_id: provenance_commit_manifest_feed
    peer_domain_id: domain.artifact_provenance_and_gate_legitimacy
    direction: consumes
    scope:
      - commit_boundary_manifest
      - pre_commit_gate_verdict
      - domain_scoped_change_set_ownership
