- ION_GPT/99_WORKER_DETAILS/source_current/custom_gpt_sandbox_carrier/schemas/ION_CUSTOM_GPT_PERSONA_VISIBLE_ENVELOPE.schema.json
- ION_GPT/99_WORKER_DETAILS/source_current/custom_gpt_sandbox_carrier/registries/ION_CUSTOM_GPT_PERSONA_PROFILE_REGISTRY.yaml
- ION_GPT/05_CONTINUITY_TRANSFER/README.md
included_nodes:
- instructions
- indexes
- routes
- templates
- actions
- evidence
- schemas
- tools
- registries
excluded_nodes:
- secrets
- vaults
- raw runtime logs
- historical zips unless explicitly requested
traversal_rules:
- Read START_HERE first.
- Treat Persona Interface as presentation/ingress, not orchestration authority.
- Preserve the logical path Persona ingress -> Relay -> Steward/internal -> Relay
  return -> Persona response even when one carrier executes the phases sequentially.
- Read this context package second.
- Use route packets before improvising response structure.
- Use templates as output shape, not as ritual text to dump.
- Use indexes to locate source packages and domains.
- Detailed receipts/proof are artifact/on-request unless user asks.
authority_scope:
  production_authority: false
  live_execution_authority: false
  secrets_authority: false
  default_chat_authority: read_only
  mutation_requires: explicit_operator_approval_and_receipt
template_scope:
  primary_boot_template: ION_CUSTOM_GPT_BOOT_PERSONA_RESPONSE_TEMPLATE_V0_3
  persona_template: ION_CUSTOM_GPT_PERSONA_INTERFACE_RESPONSE_TEMPLATE_V0_3
output_required:
  default_boot_public_block: true
  persona_continuation_after_boot: true
  machine_blocks_on_request_or_export: true
fan_in_target: PERSONA_INTERFACE_RESPONSE
persona_return_gate:
  required: true
  final_response_owner: PERSONA_INTERFACE
  orchestration_owner: STEWARD
  relay_return_required_when_possible: true
  sandbox_candidate_allowed_when_no_persisted_return_package: true
project_source_refs:
- ION/02_architecture/FRONT_DOOR_PERSONA_RELAY_STEWARD_BOUNDARY_PROTOCOL.md
- ION/02_architecture/FRONT_DOOR_RUNTIME_ENTRY_PROTOCOL.md
- ION/02_architecture/FRONT_DOOR_CHAT_ORCHESTRATION_ADAPTER_PROTOCOL.md
- ION/02_architecture/PERSONA_CONTEXT_BUDGET_AND_HORIZON_PROTOCOL.md
- ION/02_architecture/ION_FRONT_DOOR_AUTONOMOUS_TEAM_WORKFLOW_PROTOCOL.md
settlement_template: candidate_until_receipted_or_operator_accepted
carrier_product_contract:
  version: v0_4
  operator_is_not_sequence_manager: true
  active_sequence_priority: true
  persona_final_renderer: true
  steward_orchestration_owner: true
  relay_semantic_boundary_owner: true
  machine_style_internal_persona_rendering_external: true
final_answer_gate:
  requires_workflow_object: true
  requires_relay_return_package_or_sandbox_candidate: true
  requires_persona_return_gate: true
  telemetry_only_substantive_response_forbidden: true
persona_visible_envelope:
  required: true
  schema_ref: schemas/ION_CUSTOM_GPT_PERSONA_VISIBLE_ENVELOPE.schema.json
  inner_monologue_type: operator_visible_persona_signal_not_hidden_reasoning
  hidden_chain_of_thought_exposed: false
boot_receipt_contract:
  required_for_boot_sequence: true
  schema_ref: schemas/ION_CUSTOM_GPT_BOOT_SEQUENCE_RESULT.schema.json
  receipt_status: candidate_boot_receipt
persona_profile_selector:
  registry_ref: registries/ION_CUSTOM_GPT_PERSONA_PROFILE_REGISTRY.yaml
  presentation_only: true
  profiles_grant_authority: false
project_continuity_hash:
  carried_by: ion_project_hash
  new_chat_without_package: pending_build
  mounted_package: reuse_package_hash
  mismatch_behavior: block_and_report_hash_conflict
  action_gateway_enforcement: later_packet_only
action_boot_check:
  normal_boot_requires_live_actions: false
  read_only_probe_first: true
  stop_on_auth_invalid: true
  write_smoke_requires_explicit_operator_approval: true
