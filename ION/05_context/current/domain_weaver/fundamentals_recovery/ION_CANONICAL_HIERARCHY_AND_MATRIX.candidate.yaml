# ===========================================================================
# 3. RELATIONSHIP MATRIX
# ===========================================================================
relationship_matrix:
  edge_vocabulary:
    provenance: ION/05_context/current/domain_weaver/root_domain_canon/ROOT_DOMAIN_RELATIONSHIP_MATRIX_20260607.candidate.json
    adopted_via: 'ION/05_context/current/domain_weaver/universal_domain_web/SEAT_ARCHITECTURE_OPUS_ARM.candidate.yaml lines 731-748'
    reason_for_adopting_rather_than_inventing: >-
      ION already has a nine-term directed vocabulary with a full matrix behind it. Inventing a
      parallel vocabulary would create exactly the alias drift domain.true_name exists to prevent.
    terms:
      owns: 'reflexive - every domain owns itself'
      governs: 'source sets the law the target operates under'
      supplies_context_to: 'source must be mounted before target can work truthfully'
      supplies_proof_to: 'source produces receipts the target consumes as evidence'
      supplies_routes_to: 'source defines the action routes the target invokes'
      verifies: 'source witnesses target output; reports and routes only'
      co_governs: 'both must be represented in route/context/proof records before state moves'
      forms: 'source charters, splits, or retires the target'
      protected_boundary: 'pair needs secret-capability rules; grants no secret access'
      escalation_target: 'where a finding is routed when the owner cannot resolve it'
      depends_on: 'proof dependency - not accepted state, not command'
      no_direct_relation: 'explicit, so silence is never mistaken for an unmapped edge'

  no_halting_edge:
    law: 'Verification reports and routes findings; it never halts work on claimed authority.'
    consequence: >-
      There is NO `blocks` edge in this matrix. The prior-era identity protocol
      TRUE_NAME_RANK_PROTOCOL_20260603 does define one; it is deliberately not imported. Even there
      it is evidence-bearing rather than executive, and authority_transfer: false is mandatory on
      every edge.
    replacement: >-
      A domain that finds a problem emits a finding along supplies_proof_to and, if it cannot resolve
      it, routes along escalation_target. Work continues.
    why: >-
      The invented blocker is the founding failure. 875 domain runs under a read-only default
      template, each declaring zero OPEN blockers, none producing work. Any edge that can stop a peer
      reproduces that.
    justifying_fundamentals: [CF-10, CF-11, CF-12, CF-36]
    open_question_recorded: >-
      SEAT_ARCHITECTURE_OPUS_ARM line 897 asks whether escalation_target is sufficient without any
      halting edge. This file does not resolve that question and does not need to: the answer under
      current law is yes, because CF-11 is the only implemented rank-1 fundamental and it exists
      precisely to guarantee it.

  tier_level_edges:
    - {from: tier.sovereign_and_constitutional_spine, to: ALL_TIERS, type: governs, justified_by: 'CF-02, CF-13; UNIVERSAL_DOMAIN_WEB unified_tier_model.tier_asymmetries[0] - "L0 governs all tiers; only Sovereign governs L0"'}
    - {from: tier.verification_and_adversarial_witness, to: ALL_TIERS, type: verifies, justified_by: 'CF-10; tier_asymmetries[1] - "L3 witnesses all tiers including L0; never blocks work". Includes the spine itself.'}
