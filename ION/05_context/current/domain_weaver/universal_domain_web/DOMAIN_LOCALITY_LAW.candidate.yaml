schema_id: ion.domain_locality_law.v0_1_candidate
posture: candidate_only
authority: design_and_anchor_map_only
non_claims:
  - no_filesystem_moves_in_this_receipt
  - no_kernel_changes_in_this_receipt
  - no_registry_promotion
  - no_accepted_state
sovereign_mandate_date: 2026-08-03
sovereign_mandate_summary: >-
  Domain folders belong at the material they own; location is context (seat pattern).

# ---------------------------------------------------------------------------
# 1. THE LAW
# ---------------------------------------------------------------------------
law:
  principle: >-
    When a domain governs durable filesystem material inside the ION shell root, its
    canonical working context SHOULD be co-located with that material (folder-local
    `.ion/` capsule and/or opening cwd under the owned tree), while the birth package
    MAY remain in candidate_founding_domains until migration receipts settle.
  applies_when:
    - domain owns one or more bounded paths under shell root (ION/, ION_Developement/, workspace)
    - agents routinely edit, audit, or compile that material
    - seat pattern applies (compare CLAUDE.md at ION_Developement/, relay seat at ION_Relay/)
  does_not_apply_when:
    - domain is pure coordination or witness with no durable owned tree (owns_no_territory)
    - owned material lives outside the git/shell tree (territory_outside_ION_tree)
    - domain owns several disjoint trees (multi_anchor; birth registry stays index, anchors listed)
  birth_registry_role: >-
    ION/05_context/current/domain_weaver/candidate_founding_domains/ remains the
    runner discovery surface until a receipted migration changes resolver law.
  mitosis_children: >-
    Child packages (e.g. domain.context_systems.package_compilation) follow parent
    tier locality; child birth folder may stay flat while anchor points at owned slice.

# ---------------------------------------------------------------------------
# 2. MECHANISM (runner-grounded; design only)
# ---------------------------------------------------------------------------
runner_constraints:
  shell_root: directory containing pyproject.toml and ION/REPO_AUTHORITY.md
  constants:
    FOUNDING_DOMAINS_REL: ION/05_context/current/domain_weaver/candidate_founding_domains
    DIAGNOSTIC_PACKETS_REL: ION/05_context/current/domain_weaver/domain_local_diagnostic_packets
    SETTLEMENT_REL: ION/05_context/current/domain_weaver/FOUNDING_DOMAIN_SETTLEMENT.candidate.json
  functions_read:
    - name: _normalize_domain_id
      file: ION/04_packages/kernel/ion_domain_cursor_runner.py
      lines: 116-122
      behavior: Ensures domain_id prefix domain.
    - name: list_runnable_domain_ids
      file: ION/04_packages/kernel/ion_domain_cursor_runner.py
      lines: 125-166
      behavior: >-
        Reads settlement/manifest domain_ids; keeps ids only if diagnostic packet dir
        OR founding package dir exists under fixed REL paths (151-154, 155-166).
    - name: _founding_domain_dir
      file: ION/04_packages/kernel/ion_domain_cursor_runner.py
      lines: 179-181
      behavior: >-
        Single hard-coded path shell_root / FOUNDING_DOMAINS_REL / domain_id — no
        alternate search roots today.
    - name: resolve_domain_execution_bundle
      file: ION/04_packages/kernel/ion_domain_cursor_runner.py
      lines: 275-390
      behavior: >-
        Resolves diagnostic + founding_dir; merges CONTEXT_REQUIREMENTS required_reads;
        does not consult owned-location anchors unless listed in those reads.

mechanism_options_evaluated:
  option_a_move_package_and_multi_root_resolver:
    summary: Physically move each domain package to its owned path; extend _founding_domain_dir.
    code_changes:
      - _founding_domain_dir: search ordered list [co-located domain.<id>/, FOUNDING_DOMAINS_REL/id]
      - list_runnable_domain_ids: same discovery roots
      - FOUNDING_DOMAIN_SETTLEMENT birth_evidence.materialized_folder paths
      - all receipts citing candidate_founding_domains/<id>/
    kernel_edit: required (ion_domain_cursor_runner.py)
    migration_risk: high — repeats prior domain-web migration failures if done wholesale
  option_b_flat_package_plus_colocated_ion:
    summary: Keep birth package; place .ion/ ACTIVE_CONTEXT_PACKAGE at owned anchor.
    code_changes:
      - none for discovery; CONTEXT_REQUIREMENTS per domain must list .ion paths (partial today)
      - agents inherit context only if cwd or reads include anchor (no automatic resolver)
    kernel_edit: none strictly required; inconsistent without central manifest
  option_c_anchor_manifest_at_spawn:
    summary: >-
      This file's anchor_map is read at spawn; inject owned paths + .ion into required_reads.
    code_changes:
      - new helper _append_locality_anchor_reads(shell_root, domain_id, required_reads)
      - call from resolve_domain_execution_bundle after _shared_domain_weaver_reads (~363)
      - constant DOMAIN_LOCALITY_LAW_REL under domain_weaver/universal_domain_web/
    kernel_edit: required (small, additive); no moves

chosen_mechanism: option_c_anchor_manifest_at_spawn
chosen_rationale: >-
  Preserves _founding_domain_dir (179-181) and settlement discovery unchanged for W0
  safety; centralizes the 45-package spine in one candidate law file; enables phased
  co-located .ion materialization (option_b) via manifest rows without moving birth
  packages. Option (a) deferred until per-domain migration receipts and resolver
  multi-root are proven on one pilot (domain.ion_system_definition or kernel slice).

