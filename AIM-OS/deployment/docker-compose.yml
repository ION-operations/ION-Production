version: '3.8'

services:
  # Main AIM-OS application
  aether:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aether-main
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      # CMC Configuration
      - CMC_DATA_DIR=/app/data/cmc
      - CMC_DB_PATH=/app/data/cmc/cmc.db
      - CMC_WAL_MODE=true
      - CMC_CACHE_SIZE_MB=128
      
      # HHNI Configuration
      - HHNI_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - HHNI_CACHE_DIR=/app/data/hhni/cache
      - HHNI_ENABLE_DVNS=true
      
      # VIF Configuration
      - VIF_AGENT_ID=aether-production
      - VIF_KAPPA_THRESHOLD=0.80
      
      # APOE Configuration
      - APOE_MAX_WORKERS=4
      - APOE_DEFAULT_BUDGET=10000
      
      # SEG Configuration
      - SEG_BACKEND=networkx
      - SEG_PERSIST_DIR=/app/data/seg
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from cmc_service import MemoryStore; from hhni import HierarchicalIndex; from seg import SEGraph; print('Healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aether-network

  # Cross-model MCP server
  cross-model-mcp:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - LOG_LEVEL=info
      - MCP_PORT=8080
      - PYTHONPATH=/app
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
      - ../mcp_memory:/app/mcp_memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - aether-network

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - aether-network

  # Optional: Neo4j for SEG persistence (production)
  neo4j:
    image: neo4j:5.11
    container_name: aether-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/aether-production-password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped
    networks:
      - aether-network
    profiles:
      - production  # Only start with --profile production

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: aether-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - aether-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: aether-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aether-admin-change-me
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - aether-network
    profiles:
      - monitoring

volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  aether-network:
    driver: bridge
