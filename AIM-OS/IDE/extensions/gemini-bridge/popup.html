<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM-OS Bridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #e8eaed;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 16px 20px;
            border-bottom: 1px solid rgba(138, 180, 248, 0.2);
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
            color: #8ab4f8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 .logo {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: linear-gradient(135deg, #8ab4f8, #669df6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #1a1a2e;
        }

        .header .subtitle {
            font-size: 11px;
            color: #9aa0a6;
            margin-top: 4px;
        }

        .status-section {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.connected {
            background: #34a853;
            box-shadow: 0 0 8px rgba(52, 168, 83, 0.5);
        }

        .status-dot.disconnected {
            background: #ea4335;
            box-shadow: 0 0 8px rgba(234, 67, 53, 0.5);
        }

        .status-info {
            flex: 1;
        }

        .status-label {
            font-size: 13px;
            font-weight: 600;
        }

        .status-detail {
            font-size: 11px;
            color: #9aa0a6;
            margin-top: 2px;
        }

        .stats-section {
            padding: 16px 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 12px;
        }

        .stat-label {
            color: #9aa0a6;
        }

        .stat-value {
            color: #e8eaed;
            font-weight: 500;
            font-family: 'Cascadia Code', 'Consolas', monospace;
        }

        .actions {
            padding: 12px 20px 16px;
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(138, 180, 248, 0.3);
            border-radius: 8px;
            background: rgba(138, 180, 248, 0.08);
            color: #8ab4f8;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(138, 180, 248, 0.16);
            border-color: rgba(138, 180, 248, 0.5);
        }

        button:active {
            transform: scale(0.97);
        }

        button.primary {
            background: rgba(138, 180, 248, 0.15);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1><span class="logo">A</span> AIM-OS Gemini Bridge</h1>
        <div class="subtitle">Web-to-MCP Native Messaging</div>
    </div>

    <div class="status-section">
        <div class="status-dot disconnected" id="statusDot"></div>
        <div class="status-info">
            <div class="status-label" id="statusLabel">Connecting...</div>
            <div class="status-detail" id="statusDetail">Checking native host</div>
        </div>
    </div>

    <div class="stats-section">
        <div class="stat-row">
            <span class="stat-label">Tool Calls</span>
            <span class="stat-value" id="totalCalls">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Last Tool</span>
            <span class="stat-value" id="lastTool">—</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Errors</span>
            <span class="stat-value" id="errorCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Last Active</span>
            <span class="stat-value" id="lastTimestamp">—</span>
        </div>
    </div>

    <div class="actions">
        <button class="primary" id="reconnectBtn">↻ Reconnect</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
