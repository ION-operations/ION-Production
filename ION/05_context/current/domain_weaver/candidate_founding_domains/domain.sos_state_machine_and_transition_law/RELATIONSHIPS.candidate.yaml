    boundary: >-
      They own founding domain set settlement posture; I materialize W10
      candidate context under their packet law.

verify_edges:
  - peer: domain.context_proof_gate_enforcement
    edge: verifies
    boundary: >-
      They verify CONTEXT PROOF on returns; I define context_proof_remediation
