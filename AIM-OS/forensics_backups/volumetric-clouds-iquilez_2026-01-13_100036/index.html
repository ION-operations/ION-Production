<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inigo Quilez Volumetric Clouds (WebGL2)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }
      #canvas:active {
        cursor: grabbing;
      }
      #overlay {
        position: fixed;
        left: 12px;
        top: 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 10px 12px;
        border-radius: 8px;
        max-width: 520px;
        line-height: 1.35;
        font-size: 13px;
        pointer-events: none;
      }
      #overlay code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
        font-size: 12px;
      }
      #error {
        color: #ffb4b4;
        margin-top: 8px;
        white-space: pre-wrap;
        pointer-events: auto;
      }
      #info {
        opacity: 0.9;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div><strong>Inigo Quilez Volumetric Clouds</strong></div>
      <div id="info">Drag mouse to rotate camera. WebGL2 required.</div>
      <div id="error"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
