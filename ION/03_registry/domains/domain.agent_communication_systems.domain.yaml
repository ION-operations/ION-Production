mission: >-
  Own the visible agent communication substrate: contact contracts, room
  contracts, room capsules, directive pickup, bounded automation limits, and
  cockpit projections that let agents coordinate without fake simulation or
  hidden authority expansion.
scope:
  - agent contact discovery and address books
  - Team Comms rooms, direct rooms, domain rooms, and mission rooms
  - room capsules and route-deeper refs
  - ion-agent-comms directive schema and pickup evidence
  - bounded automation prompt/time limits for comms dispatch
  - cockpit visibility for messages, runs, rooms, contacts, receipts, and proof chains
