schema_id: ion.vnext.control_surface_registry.v1
status: candidate
purpose: "Canonical registry of the first safety controls promoted into ION_VNEXT."
authority: candidate_until_landed_with_receipt
controls:
  path_authority:
    source_module: 02_kernel/ion_core/src/kernel/ion_path_authority.py
    purpose: "Classify and authorize workspace paths by purpose, root, and policy."
    required_before: ["artifact_write", "workspace_migration", "source_pool_promotion"]
  workspace_root_registry:
    source_module: 02_kernel/ion_core/src/kernel/ion_workspace_root_registry.py
    purpose: "Resolve current roots, canonical roots, aliases, and root-class warnings."
    required_before: ["agent_launch", "migration_batch", "canon_cutover"]
  ai_movement_gate:
    source_module: 02_kernel/ion_core/src/kernel/ion_ai_movement_gate.py
    purpose: "Reject wrong-root, wrong-cwd, secret/vault, alias, and authority-escalating movements."
    required_before: ["agent_file_write", "workpacket_execution", "copy_into_vnext"]
  codex_work_request_target_binding:
    source_module: 02_kernel/ion_core/src/kernel/ion_codex_work_request_target_binding.py
    purpose: "Bind Codex work requests to explicit target roots/movement classes."
    required_before: ["codex_queue_dispatch", "multi-root_work_request"]
  agent_cwd_boundary:
    source_module: 02_kernel/ion_core/src/kernel/ion_agent_cwd_boundary.py
    purpose: "Prevent AI workers from silently launching from the wrong project root."
    required_before: ["codex_cli_worker", "cursor_worker", "carrier_subagent"]
  context_proof_gate:
    source_module: 02_kernel/ion_core/src/kernel/ion_context_proof_gate.py
    purpose: "Validate worker return context proof before domain output can be treated as reviewable."
    required_before: ["domain_worker_return", "context_bound_integration", "state_claim_review"]
  template_action_gate:
    source_module: 02_kernel/ion_core/src/kernel/ion_template_action_gate.py
    purpose: "Validate worker return template/action proof and touched-path shape before state-bearing movement."
    required_before: ["state_bearing_return", "source_promotion_landing", "next_packet_execution"]
  carrier_mount_receipt:
    source_module: 02_kernel/ion_core/src/kernel/ion_carrier_mount_receipt.py
    purpose: "Build and validate carrier mount receipts and persona presentation authority boundaries."
    required_before: ["carrier_remount", "persona_presentation", "context_mount_claim"]
  operator_artifact_hygiene_check:
    source_module: 02_kernel/ion_core/src/kernel/ion_operator_artifact_hygiene_check.py
    purpose: "Validate operator-facing artifact and upload-kit shape before release, export, or package handoff."
    required_before: ["operator_artifact_release", "gpt_upload_kit_handoff", "package_export_review"]
test_roots:
  - 02_kernel/ion_core/tests/control
blocked_from_this_wave:
  - runtime_current_state_json
  - connector_generated_status_json
  - private_or_vault_material
  - .git_history
  - package_bulk_copy
