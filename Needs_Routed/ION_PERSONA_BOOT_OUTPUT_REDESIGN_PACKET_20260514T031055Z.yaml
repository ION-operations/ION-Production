design_decisions:
- id: D-001
  decision: Use YAML for serious ION telemetry, but keep prose minimal outside the blocks.
  rationale: YAML is parseable and easier to inherit than decorative text lines; ordinary answers must not become noisy telemetry.
- id: D-002
  decision: Separate human boot summary from full proof blocks.
  rationale: Reconciles the compact user-facing boot contract with the machine-output requirement for inheritable proof.
- id: D-003
  decision: Rename or subtype 'inner_monologue' as operator_visible_persona_signal_not_hidden_reasoning.
  rationale: Preserves the desired persona depth while preventing hidden chain-of-thought or false consciousness claims.
- id: D-004
  decision: Do not make color semantically required in standard ChatGPT output.
  rationale: Normal chat cannot reliably control custom colors; color can exist in a Canvas/React prototype or external cockpit UI, while YAML labels preserve meaning.
- id: D-005
  decision: 'Boot v0.5 performs a real preflight matrix: packages, source posture, current state, doctrine, Actions, MCP, schemas, tests, route completion.'
  rationale: The operator asked for an over-the-top serious boot that ingests ION, checks Actions, and avoids shallow status cosplay.
