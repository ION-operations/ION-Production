name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/run_local_demo.py
      - run: python scripts/run_mcp_trace_harness.py
      - run: python scripts/validate_mcp_trace_harness.py
      - run: python scripts/validate_mongodb_contract.py
      - run: python scripts/validate_orchestration_plan.py
      - run: python scripts/validate_scaffold.py
