schema_id: ion.branch_context_node.v0_1
branch_id: ion_architecture
branch_label: ION Architecture
path: ION/02_architecture
maturity_level: B3_routed_branch
purpose: Architecture protocol branch containing ION-wide laws, candidate protocols, boundary contracts, and design surfaces.

authority:
  accepted_state_claim: false
  production_authority: false
  live_execution_authority: false
  default_work_authority: read_only_or_sandbox_candidate
  requires_operator_approval_for:
    - production_write
    - live_execution
    - connector_mutation
    - accepted_state_landing

parent_domain: ion_core
parent_chain:
  - ion_repo_root
  - ion_core
child_domains: []

read_order:
  - README.md
  - ION_CONTEXT_CAPSULE.yaml
  - README_BRANCH_CONTEXT_PROTOCOL.md
  - CONTEXT_GRAPH_SUBSTRATE_PROTOCOL.md
  - CONTEXT_NODE_AND_PACKAGE_PROTOCOL.md
  - EVENTED_TEMPLATE_FILE_GRAPH_PROTOCOL.md

local_surfaces:
  protocols:
    - README_BRANCH_CONTEXT_PROTOCOL.md
    - CONTEXT_GRAPH_SUBSTRATE_PROTOCOL.md
    - CONTEXT_NODE_AND_PACKAGE_PROTOCOL.md
    - EVENTED_TEMPLATE_FILE_GRAPH_PROTOCOL.md
  routes: []
  templates: []
  schemas:
    - ../03_registry/ion_branch_context_node.schema.json
  agents: []
  registries:
    - ../03_registry/ion_branch_context_policy.yaml
  tests:
    - ../tests/test_kernel_ion_readme_branch_context_protocol.py
  receipts: []
  status: []
  child_index: []

receipts:
  latest: []
  required_before_state_claim: true
  missing_receipt_response: emit_blocker_or_candidate_receipt_fragment

continuity_export:
  include:
    - README.md
    - ION_CONTEXT_CAPSULE.yaml
    - README_BRANCH_CONTEXT_PROTOCOL.md
    - CONTEXT_GRAPH_SUBSTRATE_PROTOCOL.md
    - CONTEXT_NODE_AND_PACKAGE_PROTOCOL.md
    - EVENTED_TEMPLATE_FILE_GRAPH_PROTOCOL.md
    - ../03_registry/ion_branch_context_node.schema.json
    - ../03_registry/ion_branch_context_policy.yaml
  exclude:
    - secrets
    - credentials
  export_profile: null

tags:
  - branch:architecture
  - node:capsule
  - state:candidate
  - authority:no-production
  - authority:no-live
  - route:context-sync
