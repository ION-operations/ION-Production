      disposition_retire_or_merge: retired_candidate
      live_domains_missing_f6_posture: >-
        Absence — backfill via DOMAIN_WEB_TEAM f6_marks batches; do not infer traffic_shaped_active from
        presence in live_domains alone without explicit mark.
    detects_absence:
      detects_absence: true
      probe_id: hierarchy_web_node_f6_posture_missing
      invoke_hint: >-
