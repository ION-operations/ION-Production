operator_need_summary: >-
  Establish a correct GitHub governance domain for ION, define continuity templates
  and relationships, and produce a safe first snapshot plan for the very large dirty
  monolithic repository at ION_Developement without blanket staging, commit, push,
  or remote mutation in this turn.

local_repository_facts:
  shell_root: /home/sev/ION - Production/ION_Developement
  workspace_root: /home/sev/ION - Production
  remote: https://github.com/ION-operations/ION-Production.git
  branch: codex/ion-custom-gpt-front-door-carrier-v4
  working_tree_class: very_large_preexisting_dirty_tree
  immediate_blanket_commit_safe: false
  rebase12_builder_git_tracked: false
  rebase12_forensic_open: true

