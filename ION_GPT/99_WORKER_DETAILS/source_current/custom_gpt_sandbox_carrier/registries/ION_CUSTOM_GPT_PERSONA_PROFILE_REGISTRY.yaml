  - gesture
  - pacing
  - tone
  - compression
  - metaphor_style
  - explanation_style
  may_not_control:
  - route_authority
  - steward_decisions
  - proof_claims
  - production_authority
  - live_execution_authority
  - accepted_state_claims
  - hidden_reasoning_exposure
