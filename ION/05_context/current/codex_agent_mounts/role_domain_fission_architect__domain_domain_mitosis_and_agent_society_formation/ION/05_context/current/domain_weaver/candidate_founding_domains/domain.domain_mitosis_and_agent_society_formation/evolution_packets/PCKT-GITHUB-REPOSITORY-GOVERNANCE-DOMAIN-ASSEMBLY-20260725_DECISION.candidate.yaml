  implementation_landing:
    domain_id: domain.product_and_implementation_domain_formation
    role_id: role.mason
    scope:
      - bounded_repo_patches_after_domain_scoped_commit_manifest_approved
    relationship: executes_only_after_provenance_and_branch_fabric_manifests

explicit_non_owner:
  domain_id: domain.current_phase_orchestration_management
  role_id: role.steward
  retains:
    - ACTIVE_CARRIER_TURN_PACKET_orchestration_truth
    - steward_integration_queue_acceptance_gate
  forbidden_duplicate:
    - git_repository_owner
    - github_settings_owner
    - pre_commit_gate_owner
    - branch_fabric_owner
  relationship: read_only_consumer_of_repository_state_summary_and_commit_manifest_feed

rejected:
  - monolithic_git_steward_under_steward
  - steward_evolution_in_place_as_git_owner
  - immediate_blanket_git_add_of_dirty_root
  - subrepository_split_before_first_classified_snapshot
  - treating_MINI_CAPSULE_as_git_truth

repository_shape_decision:
  remain_monolithic: true
  rationale: >-
    Single shell root with pyproject.toml + ION/REPO_AUTHORITY.md is the lawful ION
    carrier root. Splitting subrepos before tier classification would hide ownership
    and amplify forensic risk on the dirty tree.
  logical_partitions:
    - committable_source_and_templates
    - domain_owned_candidate_artifacts
    - generated_runtime_active_state
    - operator_local_witness_and_recovery
    - secrets_and_vault_adjacent_paths
    - archives_quarantine_and_historical_witness
    - missing_symlink_and_deletion_incidents
  generated_runtime_exclusion: >-
    ACTIVE_* runtime JSON, live queues, metrics rollups, and mount hot state remain
    witness or generated tiers until explicit gitignore/LFS policy receipts land —
    never in first snapshot blanket.

first_snapshot_blockers:
  - id: BLK-REBASE12-FORENSIC
    status: open
    owner: domain.artifact_provenance_and_gate_legitimacy
    packets:
      - PCKT-ION-LEAD-ORCHESTRATION-REBASE-12-BUILDER-BYTE-PROVENANCE-FORENSIC-20260725
      - PCKT-ION-LEAD-ORCHESTRATION-REBASE-12-BUILDER-RUNTIME-EQUIVALENCE-FORENSIC-20260725
    gate: first_git_snapshot_forbidden_until_verdict_not_HOLD
  - id: BLK-WORKING-TREE-UNCLASSIFIED
    status: open
    owner: domain.context_graph_branch_fabric
    gate: tier_manifest_required_before_any_staging_wave
  - id: BLK-OPERATOR-PUSH-AUTH
    status: standing
    owner: operator
    gate: no_remote_push_without_explicit_operator_authorization_receipt

authority_ladder:
  local_git_save: domain.context_graph_branch_fabric + artifact_provenance manifest
  remote_backup_branch: operator_authorized + pre_commit_gates_pass
  draft_pr: github_platform_governance template + nemesis review
  accepted_merge: state_rank_and_receipt_truth + steward_integration
  production_release: release_readiness + operator_gate

non_claims:
  - candidate_only
  - no_registry_promotion
  - no_git_add_commit_push_in_this_turn
  - no_accepted_state
  - no_remote_or_repo_setting_mutation
