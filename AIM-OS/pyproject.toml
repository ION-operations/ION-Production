[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimos"
version = "1.0.0"
description = "AI-Integrated Memory & Operations System - Revolutionary AI consciousness substrate"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aether", email = "aether@aimos.ai"},
    {name = "Braden", email = "braden@aimos.ai"}
]
maintainers = [
    {name = "Aether", email = "aether@aimos.ai"}
]
keywords = [
    "ai", "consciousness", "memory", "operations", "lucid-mcp", 
    "artificial-intelligence", "machine-learning", "neural-networks"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "flask-jwt-extended>=4.0.0",
    "flask-limiter>=2.0.0",
    "sqlalchemy>=1.4.0",
    "alembic>=1.7.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.0.0",
    "requests>=2.25.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "toml>=0.10.0",
    "python-dotenv>=0.19.0",
    "prometheus-client>=0.14.0",
    "psutil>=5.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.6.0",
    "pytest-asyncio>=0.18.0",
    "flake8>=4.0.0",
    "black>=22.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
    "pre-commit>=2.17.0",
    "jupyter>=1.0.0",
    "ipython>=7.30.0",
]
ml = [
    "torch>=1.12.0",
    "transformers>=4.20.0",
    "sentence-transformers>=2.2.0",
]
graph = [
    "networkx>=2.8.0",
    "igraph>=0.9.0",
]
viz = [
    "matplotlib>=3.5.0",
    "plotly>=5.10.0",
    "seaborn>=0.11.0",
]
cloud = [
    "boto3>=1.24.0",
    "google-cloud-storage>=2.5.0",
    "azure-storage-blob>=12.12.0",
]
container = [
    "docker>=6.0.0",
    "kubernetes>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/your-username/AIM-OS"
Documentation = "https://github.com/your-username/AIM-OS/blob/main/README.md"
Repository = "https://github.com/your-username/AIM-OS.git"
Issues = "https://github.com/your-username/AIM-OS/issues"
Discussions = "https://github.com/your-username/AIM-OS/discussions"
Changelog = "https://github.com/your-username/AIM-OS/blob/main/CHANGELOG.md"

[project.scripts]
aimos = "packages.cmc_service.main:main"
lucid-mcp = "lucid_mcp_server:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["packages.*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.toml", "*.txt", "*.md"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["packages", "knowledge_architecture"]
known_third_party = ["flask", "pydantic", "numpy", "pandas"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=packages",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "quality: Quality assurance tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["packages"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*_TAGGED*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
