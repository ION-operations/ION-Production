schema_id: ion.branch_context_node.v0_1
branch_id: <branch_id>
branch_label: <Branch Label>
path: <relative/path>
maturity_level: B2_capsule_node
purpose: <What this branch owns and why it exists.>

authority:
  accepted_state_claim: false
  production_authority: false
  live_execution_authority: false
  default_work_authority: read_only_or_sandbox_candidate
  requires_operator_approval_for:
    - production_write
    - live_execution
    - connector_mutation
    - accepted_state_landing

parent_domain: <parent_branch_or_null>
parent_chain:
  - <parent_branch_or_root>
child_domains: []

read_order:
  - README.md
  - ION_CONTEXT_CAPSULE.yaml

local_surfaces:
  protocols: []
  routes: []
  templates: []
  schemas: []
  agents: []
  registries: []
  tests: []
  receipts: []
  status: []
  child_index: []

receipts:
  latest: []
  required_before_state_claim: true
  missing_receipt_response: emit_blocker_or_candidate_receipt_fragment

continuity_export:
  include:
    - README.md
    - ION_CONTEXT_CAPSULE.yaml
    - local_surfaces
    - receipts.latest
  exclude:
    - secrets
    - credentials
    - unrelated_child_detail
  export_profile: null

tags:
  - branch:<branch_slug>
  - node:capsule
  - state:candidate
  - authority:no-production
  - authority:no-live
