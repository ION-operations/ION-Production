open_edges:
  - broad Chrome extension permissions must remain explicitly receipted and justified; local capture posture is not a general entitlement
  - source/dist drift in the extension remains a known failure mode until the domain owns a build convention and runtime sync proof
  - Playwright launched with an isolated browser profile may not share the operator logged-in Chrome session; the extension remains the logged-in runtime observer
  - selector profiles must degrade and request recalibration on DOM drift rather than pretending stale selectors are valid
  - upload/drop and action-card automation must remain previewed and receipted; no silent send or autonomous approval authority is granted
