schema_id: ion.action_mcp_branch_leader_registry.v0
status: draft_non_production
version: 0.1.0
production_authority: false
live_execution_authority: false
purpose: >
  Stable Action/MCP branch leader envelopes for Custom GPT and MCP carriers.
  Branch leaders expose bounded route capsules so callers do not need a global
  flat tool list in memory.
default_route_schema_version: v0
refusal_classes:
  - SCHEMA_INVALID
  - BRANCH_ROUTE_NOT_FOUND
  - IDEMPOTENCY_KEY_REQUIRED
  - OPERATOR_APPROVAL_REQUIRED
  - CONFIRMATION_REQUIRED
  - ROUTE_NOT_INVOCABLE
  - PATH_NOT_ALLOWED
  - BRANCH_CONTEXT_NOT_MATERIALIZABLE
  - ACTOR_PROOF_REQUIRED
  - ACTOR_ROOT_NOT_REGISTERED
  - ACTOR_ROOT_NOT_ALLOWED
  - LEASE_REQUIRED
  - LEASE_TARGET_NOT_DERIVABLE
branches:
  - branch_id: desktop_rescue
    title: Desktop Rescue
    maturity: v0_1_candidate
    family: local_desktop_rescue
    path: null
    lazy_context_enabled: false
    authority_summary: Bounded local desktop rescue diagnostics and confirmation-gated targeted TERM for obvious user-space Codex/Gemini/browser processes. No reboot, no display-manager restart, no secrets, no production/live/accepted-state authority.
    context_refs:
      - ION/04_packages/kernel/ion_action_mcp_branch_leaders.py
    suggested_next_calls:
      - route_id: status
      - route_id: kill_preview
    routes:
      - route_id: status
        title: Desktop rescue status
        summary: Inspect a bounded process sample for likely desktop-freeze pressure. Does not kill processes.
        local_handler: desktop_rescue
        mutates_state: false
        route_schema_version: v0
        default_args:
          target_group: codex_gemini
          limit: 120
        args_schema:
          type: object
          properties:
            target_group:
              type: string
            limit:
              type: integer
            cpu_threshold:
              type: integer
          additionalProperties: false
      - route_id: kill_preview
        title: Desktop rescue kill preview
        summary: Preview targeted TERM candidates for a process group without killing anything.
        local_handler: desktop_rescue
        mutates_state: false
        route_schema_version: v0
        default_args:
          target_group: codex_gemini
          limit: 120
        args_schema:
          type: object
          properties:
            target_group:
              type: string
            limit:
              type: integer
          additionalProperties: false
      - route_id: kill_apply
        title: Desktop rescue targeted TERM apply
        summary: Send TERM to bounded candidate processes in a selected target group, excluding Action Gateway, cloudflared, systemd, and core services. Writes a receipt.
        local_handler: desktop_rescue
        mutates_state: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        idempotency_required: true
        route_schema_version: v0
        default_args:
          target_group: codex_gemini
          limit: 120
          max_kill_count: 20
        args_schema:
          type: object
          properties:
            target_group:
              type: string
            limit:
              type: integer
            max_kill_count:
              type: integer
            idempotency_key:
              type: string
            confirmation:
              type: string
          additionalProperties: false
  - branch_id: branch_context
    title: Branch Context
    maturity: v0_1_lazy_context_integrated
    family: branch_context_materialization
    path: .
    lazy_context_enabled: true
    authority_summary: Read-only branch/path description plus confirmation-gated candidate context and inheritance receipts.
    context_refs:
      - ION/02_architecture/LAZY_BRANCH_CONTEXT_MATERIALIZATION_PROTOCOL.md
      - ION/02_architecture/README_BRANCH_CONTEXT_PROTOCOL.md
      - ION/04_packages/kernel/ion_branch_context_materialization.py
    suggested_next_calls:
      - route_id: describe_path
      - route_id: inherit_parent_context
      - route_id: materialize_candidate_context
    routes:
      - route_id: describe_path
        title: Describe branch path
        summary: Describe one repo path using lazy branch context classification without writing files.
        local_handler: lazy_branch_context
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - path
          properties:
            path:
              type: string
            depth:
              type: string
          additionalProperties: false
      - route_id: inherit_parent_context
        title: Inherit parent context
        summary: Build or optionally write a receipt that parent context applies for this branch.
        local_handler: lazy_branch_context
        mutates_state: false
        conditional_write: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        idempotency_required: true
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - path
          properties:
            path:
              type: string
            write:
              type: boolean
            write_receipt:
              type: boolean
            idempotency_key:
              type: string
            confirmation:
              type: string
          additionalProperties: false
      - route_id: materialize_candidate_context
        title: Materialize candidate context
        summary: Build or optionally write candidate branch context for a meaningful folder.
        local_handler: lazy_branch_context
        mutates_state: false
        conditional_write: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        idempotency_required: true
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - path
          properties:
            path:
              type: string
            write:
              type: boolean
            write_candidate_capsule:
              type: boolean
            idempotency_key:
              type: string
            confirmation:
              type: string
          additionalProperties: false
  - branch_id: connector_core
    title: Connector Core
    maturity: v0_1_candidate
    family: connector_core
    authority_summary: Neutral front door for MCP/Action connector health, branch navigation, tool manifest, policy source paths, runtime posture, context plan, git status, and receipts. Read-only by default; no production or live execution authority.
    context_refs:
      - ION/05_context/current/action_surface_cartography/MCP_ACTION_NAVIGATION_INDEX_V0_1.md
      - ION/05_context/current/action_surface_cartography/AGENT_TOOL_SURFACE_PROFILE_V0_1.json
      - ION/05_context/current/action_surface_cartography/MCP_BRANCH_REDEVELOPMENT_PLAN_V0_1.md
      - ION/02_architecture/ION_CONNECTOR_TRANSPORT_AND_LOD_ROUTING_PROTOCOL.md
      - ION/03_registry/ion_chatgpt_browser_mcp_tool_policy.yaml
      - ION/03_registry/ion_action_mcp_branch_leader_registry.yaml
    suggested_next_calls:
      - route_id: status
      - route_id: tool_manifest
      - route_id: branch_map
      - route_id: context_plan
      - route_id: receipts
    routes:
      - route_id: status
        title: Connector status
        summary: Read high-level ION/MCP connector status and posture.
        mcp_tool: ion_status
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: tool_manifest
        title: Tool manifest
        summary: Read allowed tools, tool count, source paths, forbidden tools, and tool families.
        mcp_tool: ion_tool_manifest
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: branch_map
        title: Branch map
        summary: List branch leaders so agents can navigate branch-first rather than scanning raw tools.
        mcp_tool: ion_action_branch_list
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
          additionalProperties: false
      - route_id: branch_describe
        title: Describe branch
        summary: Describe one branch's routes, owner tools, authority, and suggested next calls.
        mcp_tool: ion_action_branch_describe
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - branch_id
          properties:
            branch_id:
              type: string
            path:
              type: string
            depth:
              type: string
            profile:
              type: string
          additionalProperties: false
      - route_id: context_plan
        title: Context plan
        summary: Read current connector context plan and active context surfaces.
        mcp_tool: ion_context_plan
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            max_bytes:
              type: integer
              minimum: 1
              maximum: 32768
          additionalProperties: false
      - route_id: policy_file
        title: MCP policy file
        summary: Read a bounded view of the MCP tool policy file.
        mcp_tool: ion_file_read
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            path:
              type: string
              default: ION/03_registry/ion_chatgpt_browser_mcp_tool_policy.yaml
            max_bytes:
              type: integer
              minimum: 1
              maximum: 32768
          additionalProperties: false
      - route_id: git_status
        title: Git status summary
        summary: Read bounded git posture summary without shell exposure.
        mcp_tool: ion_git_status_summary
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: daemon_status
        title: Daemon status
        summary: Read daemon/runtime posture where available.
        mcp_tool: ion_daemon_status
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: receipts
        title: Connector receipts
        summary: Search receipts by query, path, target, branch, route, or idempotency key.
        mcp_tool: ion_receipt_search
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            query:
              type: string
            limit:
              type: integer
              minimum: 1
              maximum: 50
          additionalProperties: true
  - branch_id: gateway_core
    title: Gateway Core
    maturity: v0
    family: action_gateway
    authority_summary: Health, policy, context-pack, and recent receipt reads only unless a route states otherwise.
    context_refs:
      - ION/02_architecture/ION_CUSTOM_GPT_ACTION_GATEWAY_PROTOCOL.md
      - ION/03_registry/ion_custom_gpt_action_gateway_policy.yaml
    suggested_next_calls:
      - route_id: health
      - route_id: policy
      - route_id: receipts_recent
    routes:
      - route_id: health
        title: Gateway health
        summary: Read Action Gateway health.
        mcp_tool: ion_status
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: context_pack
        title: Connector context pack
        summary: Read the active connector context plan.
        mcp_tool: ion_context_plan
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            max_bytes:
              type: integer
              minimum: 1
              maximum: 32768
          additionalProperties: false
      - route_id: policy
        title: Tool manifest and policy
        summary: Read current MCP tool manifest and source paths.
        mcp_tool: ion_tool_manifest
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: receipts_recent
        title: Recent receipts
        summary: Search recent receipt surfaces.
        mcp_tool: ion_receipt_search
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            query:
              type: string
            limit:
              type: integer
              minimum: 1
              maximum: 50
          additionalProperties: true
  - branch_id: repo_ingest
    title: Repo Ingest
    maturity: v0_1_candidate
    family: bounded_repo_ingest
    lazy_context_enabled: false
    authority_summary: Direct bounded repo/file ingest under allowlisted roots using confirmation-gated owner tools, receipts, hashes, readback proof, and no accepted-state claim.
    context_refs:
      - ION/02_architecture/ION_CONNECTOR_TRANSPORT_AND_LOD_ROUTING_PROTOCOL.md
      - ION/05_context/current/action_surface_cartography/MCP_BRANCH_REDEVELOPMENT_PLAN_V0_1.md
      - ION/03_registry/ion_chatgpt_browser_mcp_tool_policy.yaml
    suggested_next_calls:
      - route_id: apply_create
      - route_id: artifact_upload_init
      - route_id: readback
      - route_id: receipts
    routes:
      - route_id: apply_create
        title: Apply bounded create
        summary: Create one small candidate file under an allowlisted repo ingest root using ion_file_put_text. Denies overwrite by default and writes a receipt with unified diff and SHA-256.
        mcp_tool: ion_file_put_text
        mutates_state: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        artifact_lease_required: true
        agent_id_required: true
        lease_id_required: true
        required_mutation_fields:
          - confirmation
          - idempotency_key
          - agent_id
          - lease_id
        idempotency_required: true
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - target_path
            - text
            - confirmation
            - idempotency_key
            - agent_id
            - lease_id
          properties:
            target_path:
              type: string
            text:
              type: string
            expected_sha256:
              type: string
            overwrite:
              type: boolean
            confirmation:
              type: string
            idempotency_key:
              type: string
            agent_id:
              type: string
            lease_id:
              type: string
          additionalProperties: false
      - route_id: preview_patch
        title: Preview bounded patch
        summary: Preview a targeted patch to an existing file under an allowlisted patch root.
        mcp_tool: ion_bounded_patch_preview
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            target_path:
              type: string
            path:
              type: string
            old_text:
              type: string
            new_text:
              type: string
            expected_sha256:
              type: string
            operations:
              type: array
          additionalProperties: false
      - route_id: apply_patch
        title: Apply bounded patch
        summary: Apply a targeted patch to an existing file under an allowlisted patch root with confirmation, idempotency, and receipt behavior.
        mcp_tool: ion_bounded_patch_apply
        mutates_state: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        edit_lease_required: true
        agent_id_required: true
        lease_id_required: true
        required_mutation_fields:
          - confirmation
          - agent_id
          - lease_id
        idempotency_required: true
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - confirmation
            - agent_id
            - lease_id
          properties:
            target_path:
              type: string
            path:
              type: string
            old_text:
              type: string
            new_text:
              type: string
            agent_id:
              type: string
            lease_id:
              type: string
            expected_sha256:
              type: string
            operations:
              type: array
            idempotency_key:
              type: string
            confirmation:
              type: string
          additionalProperties: false
      - route_id: artifact_upload_init
        title: Init chunked artifact ingest
        summary: Start a chunked upload session for a larger candidate artifact under an allowlisted ingest root.
        mcp_tool: ion_artifact_upload_init
        mutates_state: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        artifact_lease_required: true
        agent_id_required: true
        lease_id_required: true
        required_mutation_fields:
          - confirmation
          - idempotency_key
          - agent_id
          - lease_id
        idempotency_required: true
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - artifact_name
            - confirmation
            - idempotency_key
            - agent_id
            - lease_id
          properties:
            artifact_name:
              type: string
            target_path:
              type: string
            mime_type:
              type: string
            total_bytes:
              type: integer
            expected_sha256:
              type: string
            confirmation:
              type: string
            idempotency_key:
              type: string
            agent_id:
              type: string
            lease_id:
              type: string
          additionalProperties: false
      - route_id: artifact_upload_chunk
        title: Upload artifact chunk
        summary: Upload one base64 artifact chunk with optional chunk SHA-256.
        mcp_tool: ion_artifact_upload_chunk
        mutates_state: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        artifact_lease_required: true
        agent_id_required: true
        lease_id_required: true
        required_mutation_fields:
          - confirmation
          - idempotency_key
          - agent_id
          - lease_id
        idempotency_required: true
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - upload_id
            - chunk_index
            - data_base64
            - confirmation
            - idempotency_key
            - agent_id
            - lease_id
          properties:
            upload_id:
              type: string
            chunk_index:
              type: integer
            data_base64:
              type: string
            chunk_sha256:
              type: string
            confirmation:
              type: string
            idempotency_key:
              type: string
            agent_id:
              type: string
            lease_id:
              type: string
          additionalProperties: false
      - route_id: artifact_upload_commit
        title: Commit artifact upload
        summary: Commit a completed chunked artifact upload, write target file, and produce artifact receipt.
        mcp_tool: ion_artifact_upload_commit
        mutates_state: true
        confirmation_required: ION_BOUNDED_WRITE_CONFIRMED
        artifact_lease_required: true
        agent_id_required: true
        lease_id_required: true
        required_mutation_fields:
          - confirmation
          - idempotency_key
          - agent_id
          - lease_id
        idempotency_required: true
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - upload_id
            - confirmation
            - idempotency_key
            - agent_id
            - lease_id
          properties:
            upload_id:
              type: string
            confirmation:
              type: string
            idempotency_key:
              type: string
            agent_id:
              type: string
            lease_id:
              type: string
          additionalProperties: false
      - route_id: readback
        title: Readback target
        summary: Read back a target file after repo ingest and verify SHA-256/bytes.
        mcp_tool: ion_file_read
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          required:
            - path
          properties:
            path:
              type: string
            max_bytes:
              type: integer
              minimum: 1
              maximum: 262144
          additionalProperties: false
      - route_id: receipts
        title: Ingest receipts
        summary: Search receipts for repo ingest activity by path, hash, or idempotency key.
        mcp_tool: ion_receipt_search
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            query:
              type: string
            limit:
              type: integer
              minimum: 1
              maximum: 50
          additionalProperties: false
  - branch_id: latest_context
    title: Latest Context / Handoff
    maturity: v0_1_candidate
    family: context_handoff_mount
    action_mount_equivalent: false
    authority_summary: Read-only latest handoff, context-pack, receipt, freshness, and next-route mount views after local bootloader package. Not ACTION_MOUNT_EQUIVALENT.
    context_refs:
      - ../ION_GPT/02_PACKAGES_TO_UPLOAD/ION_GPT_FINAL_OPERATOR_UPLOAD_KIT_20260516T171935Z/02_UPLOAD_EVERY_FILE_IN_THIS_FOLDER_TO_GPT_KNOWLEDGE/00_ROOT_MANIFEST.json
      - ../ION_GPT/02_PACKAGES_TO_UPLOAD/ION_GPT_FINAL_OPERATOR_UPLOAD_KIT_20260516T171935Z/01_PASTE_THIS_IN_GPT_BUILDER_INSTRUCTIONS.md
      - ../ION_GPT/02_PACKAGES_TO_UPLOAD/ION_GPT_FINAL_OPERATOR_UPLOAD_KIT_20260516T171935Z/02_UPLOAD_EVERY_FILE_IN_THIS_FOLDER_TO_GPT_KNOWLEDGE/01_START_HERE_MOUNT_ORDER.md
      - ../ION_GPT/02_PACKAGES_TO_UPLOAD/ION_GPT_FINAL_OPERATOR_UPLOAD_KIT_20260516T171935Z/02_UPLOAD_EVERY_FILE_IN_THIS_FOLDER_TO_GPT_KNOWLEDGE/04_ACTIONS_MCP_AND_BRANCH_GATEWAY.md
      - ../ION_GPT/02_PACKAGES_TO_UPLOAD/ION_GPT_FINAL_OPERATOR_UPLOAD_KIT_20260516T171935Z/02_UPLOAD_EVERY_FILE_IN_THIS_FOLDER_TO_GPT_KNOWLEDGE/09_OPERATOR_APPROVALS_AND_RED_ALERT.md
      - ION/05_context/current/codex_solo/HOT_CONTEXT.md
      - ION/05_context/current/codex_solo/MINI.md
      - ION/05_context/current/codex_solo/CAPSULE.md
      - ION/05_context/current/codex_solo/history
    suggested_next_calls:
      - route_id: mount_status
      - route_id: latest_handoff
      - route_id: current_context_pack
      - route_id: recent_receipts
      - route_id: next_allowed_routes
      - route_id: package_freshness
    routes:
      - route_id: mount_status
        title: Mount status
        summary: Read mount truth state, local package version/hash, latest handoff id, freshness status, and action-mount-equivalent posture.
        local_handler: latest_context
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: latest_handoff
        title: Latest handoff
        summary: Read active objective, latest candidate handoff, blockers, recommended next packet, receipt refs, source posture, and non-claims.
        local_handler: latest_context
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: current_context_pack
        title: Current context pack
        summary: Read required reads, context refs, bounded excerpts or pointers, hashes, proof obligations, and stale/missing context warnings.
        local_handler: latest_context
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: recent_receipts
        title: Recent receipts
        summary: Read latest relevant receipt refs with candidate/accepted settlement posture and hashes.
        local_handler: latest_context
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 20
          additionalProperties: false
      - route_id: next_allowed_routes
        title: Next allowed routes
        summary: Read allowed next route ids, authority classes, mutation approval requirements, and blockers before route use.
        local_handler: latest_context
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties: {}
          additionalProperties: false
      - route_id: package_freshness
        title: Package freshness
        summary: Compare installed-package proof, if supplied, to latest local rebuilt package timestamp/hash.
        local_handler: latest_context
        mutates_state: false
        route_schema_version: v0
        args_schema:
          type: object
          properties:
            installed_package_timestamp:
              type: string
            installed_manifest_sha256:
              type: string
          additionalProperties: false
  - branch_id: project_workbench
    title: Project Workbench
    maturity: v0
    family: project_workbench
    authority_summary: Bounded project status, context, file reads, previews, and confirmation-gated project actions.
    context_refs:
      - ION/04_packages/kernel/ion_project_workbench.py
      - ION/03_registry/mcp_full_carrier_tool_registry.yaml
    suggested_next_calls:
      - route_id: workspace_status
      - route_id: context_capsule
      - route_id: file_slice_read
    routes:
      - route_id: workspace_status
        title: Workspace status
        summary: Read bounded project workspace status.
        mcp_tool: ion_project_workspace_status
        mutates_state: false
        route_schema_version: v0
        default_args:
          project_id: cosmos
        args_schema:
          type: object
          properties:
            project_id:
              type: string
            probe_preview:
              type: boolean
          additionalProperties: false
      - route_id: context_capsule
        title: Project context capsule
        summary: Read project branch capsule and route context.
        mcp_tool: ion_project_context_capsule
        mutates_state: false
        route_schema_version: v0
        default_args:
          project_id: cosmos
        args_schema:
          type: object
          properties:
            project_id:
