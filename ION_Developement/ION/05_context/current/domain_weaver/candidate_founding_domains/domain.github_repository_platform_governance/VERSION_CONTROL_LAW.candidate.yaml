commit_worthiness_law:
  definition: >-
    A git commit is a public claim that the staged delta is worth keeping: owned,
    verified, bounded, and intentional — not merely present on disk.
  may_commit_when_all:
    - bounded_workpack_or_packet_id names the commit intent and rollback path
    - every staged path has owner_domain_id and reason in a commit-boundary manifest
    - working-tree tier classification excludes T5/T6 stale-or-quarantine unless explicit carry receipt
    - domain.artifact_provenance_and_gate_legitimacy pre-commit gate stack passes (see secrets_precondition)
    - baseline-forward posture: commit asserts chosen forward state, not reconciliation with stale index
    - no mass snapshot of unreviewed tree state (forbidden default)
  must_not_commit_when_any:
    - material is stale, unowned, unverified, or candidate-only without explicit carry decision
    - change is only git index noise from cross-root moves without forward baseline intent
    - intent is backup, fear-of-loss, or "sync everything" without manifest
    - intent is historical reconciliation, reorg archaeology, or index-vs-disk delta hunting
    - secrets scan not complete or BLOCKED_SECRET_RISK
    - sovereign has not escalated when commit would assert production or registry promotion

commit_classes:
  sovereign_ruling_date: "2026-08-03"
  sovereign_ruling_verbatim: >-
    we may indeed need to get the project saved to git state for safety during work, but with
    understanding the git is only a quarantine branch not production branch and that its there to be
    cleaned and organized from.
  classes:
    production_governance_commit:
      claim: WORTH
      definition: >-
        A public claim that the staged delta is worth keeping: owned, verified, bounded, and
        intentional. All rules under commit_worthiness_law apply unchanged.
      requirements:
        - every staged path has owner_domain_id and reason in a commit-boundary manifest
        - bounded manifest (first governance commit ≤30 paths per PCKT-VCTL-03)
        - gate.git_snapshot.secret_scan pass before git add
        - baseline-forward posture; not a reconciliation or archaeology commit
      branch_posture: >-
        Successor mainline branches (for example aether/ion-development-mainline-2026-08) carry
        production/governance commits only.
    quarantine_snapshot_commit:
      claim: POSITION
      definition: >-
        A public claim of where the tree stood before a move or clean-up — explicitly NOT a
        quality, ownership, or endorsement claim. Same doctrine as kernel retrieval quarantine
        (ION/05_context/current/kernel_production/KERNEL_RETRIEVAL_AND_QUARANTINE_DOCTRINE.candidate.yaml):
        non-destructive preservation to clean FROM.
      requirements:
        - sovereign or bounded workpack explicitly authorizes snapshot intent (restore point)
        - gate.git_snapshot.secret_scan pass before git add; credential-like paths refused
        - branch name MUST begin with quarantine/ and include date or packet id at a glance
        - commit message MUST state uncurated pre-work snapshot; MUST NOT be read as endorsement
        - may contain unowned, stale, and candidate-only material by design
        - local commit default; push requires separate push authorization receipt
      forbidden_uses:
        - base for production work or merge-base implying worth inheritance
        - registry promotion or accepted-state claims
        - substitute for Sovereign backups
      enforcement_and_witness:
        - branch prefix quarantine/ blocks mistaken mainline merges via naming + OPERATING_CARD review
        - production successor branches documented in branch_posture must not list quarantine/* as parent
        - merge-base receipts (PCKT-VCTL-02) must record cutover from quarantine read-only, not descent
        - commit message template includes literal QUARANTINE SNAPSHOT and not-endorsement clause
        - remote branch protection proposals (platform_surface) may deny push from quarantine/* without receipt
      relationship_to_commit_worthiness_law: >-
        quarantine_snapshot_commit is the sole exception to must_not_commit mass snapshot and
        unowned-material rules when sovereign-authorized restore-point intent is recorded.

sovereign_never_touches_git:
  law: >-
    Git operations (status interpretation, staging, commit, branch, merge, push, remote
    repair) are agent/domain work under this governance stack — never the Sovereign's job.
  defect_definition: >-
    Any workflow, UI, or instruction that asks Braden to resolve merge conflicts, pick
    branches, run add/commit/push, or interpret mass deletions is a defect in
    domain.github_repository_platform_governance and its peer domains — route to a bounded
    workpack with a delivery receipt instead.
  operator_surface: >-
    The Sovereign may approve or refuse packets; he does not execute git.

repo_boundary_ruling:
  canonical_ion_development_root:
    path: /home/sev/ION - Production/ION_Developement
    evidence:
      - pyproject.toml and ION/REPO_AUTHORITY.md co-located (ION shell root law)
      - git rev-parse toplevel matches this path (verified 2026-08-03)
    remote: https://github.com/ION-operations/ION-Production.git
  parent_workspace_root:
    path: /home/sev/ION - Production
    role: >-
      Cursor workspace host; may hold sibling artifacts (.github/workflows) that moved
      UP out of ION_Developement. Not a substitute git identity without explicit registry entry.
  home_sev_repo:
    path: /home/sev
    status: overlapping_accidental_repo
    gitignore_line_4: "*"
    ruling: >-
      AGENTS.md forbids using /home/sev as project git root. Treat as safety-blocked
      witness repo: do not stage ION work through it. Recommend (not enact): archive or
      detach .git at /home/sev after branch-fabric documents where historical commits live.
  spanning_two_directories:
    handling: >-
      When live tree spans ION_Developement + parent ION - Production (and worktrees under
      .ion_worktrees/), git in ION_Developement alone cannot see out-of-repo destinations.
      Do not reconcile historical cross-root moves against git index. Forward commits use
      bounded manifests of paths intentionally kept in-repo only.

index_witness_note:
  symptom: >-
    git may report mass deletions when folders moved outside the repo or to sibling roots;
    sample witnesses include workflows relocated to parent .github and AIM-OS under worktrees.
  interpretation_law: >-
    Under git_index_stale_witness_law these counts are stale index witnesses, not deletion
    truth or loss totals. Do not block forward baseline work on completing historical reorg maps.
  metrics_witness_2026_08_03:
    short_status_lines: 20644
    deleted_lines: 18915
    untracked: 1479
    modified: 250
    note: counts are git path index witnesses only; superseded reorg-manifest workpack killed by Sovereign 2026-08-03

