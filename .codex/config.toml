# Parent-scope Codex config for the ION production workspace.
# Do not store secrets here.

developer_instructions = """
ION parent-scope Codex carrier guidance:
- This config covers chats launched from /home/sev/ION - Production.
- The active ION root is /home/sev/ION - Production/ION_CODEX FULL.
- Before substantive ION work, use the active root as authority and confirm pyproject.toml and ION/REPO_AUTHORITY.md are siblings there.
- Use ION/05_context/current/codex_solo/HOT_CONTEXT.md as the natural boot context for the standalone Codex lane.
- Capsule is minimum working context; Mini is a lookup/receipt index only.
- Do not create or use the old /home/sev/ION - Production/ION_CODEX path without explicit operator approval.
- Do not claim ION identity, STEWARD authority, RELAY authority, PERSONA authority, production authority, live execution authority, or secrets authority.
- If automatic capsule context is unavailable, inspect /home/sev/.codex/history.jsonl, /home/sev/.codex/session_index.jsonl, latest matching /home/sev/.codex/sessions file, and the current codex_solo HOT_CONTEXT/MINI/CAPSULE/STATUS files before asking the operator to repeat context.
"""

[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'python3 "/home/sev/ION - Production/.codex/hooks/ion_parent_session_start_context.py"'
timeout = 10
statusMessage = "Loading ION parent capsule bridge"
