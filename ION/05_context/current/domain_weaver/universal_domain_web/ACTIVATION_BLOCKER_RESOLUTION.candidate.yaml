sub_charter_invocability:
  governance_silence_finding: >-
    Prior corpus described pre-activation dotted children (SEAT_GROWTH_LAW section_3_parent_child_law
    pre_activation_child_lifecycle) but named no parent admission artifact; UNREGISTERED_PACKAGE_DISPOSITION
    and WAVE_MINUS_1 cited missing parent invocability without a file spec.
  smallest_new_rule:
    name: sub_charter_invocability_admission
    schema_id: ion.subcharter_invocability_admission.v0_1_candidate
    is_new: true
    how_parent_admits: >-
      The invocable parent domain emits a candidate-only admission receipt under its founding folder at
      candidate_founding_domains/{parent_domain_id}/sub_charter_admissions/{child_domain_id}.candidate.yaml
      after bounded work review, citing the child charter scope slice and SEAT_GROWTH_LAW section_3.
    required_fields:
      - parent_domain_id
      - child_domain_id
      - admitted_scope_slice
      - parent_relinquish_or_coown_ref
      - cited_necessity_evidence_paths
      - admitted_at
      - posture
    settlement_behavior: >-
      Child settlement still requires the FULL dotted domain_id string appended to
      FOUNDING_DOMAIN_SETTLEMENT.candidate.json via supersession receipt; parent-only rows never
      cover children (NEW_DOMAIN_ACTIVATION_REQUIREMENTS subdomain_dotted_id_support;
      SEAT_GROWTH_LAW AP6_parent_only_settlement_rows).
    post_settlement_operation: >-
      After E1 artifacts exist and settlement lists the dotted id, the child is independently invocable
      under its own --domain-id; it does not operate under the parent forever. Pre-activation routing
      through parent lanes ends at admission receipt plus settlement append.
    dotted_children_in_scope:
      - domain.context_systems.package_compilation
      - domain.runtime_carrier_and_action_admission.hooks_mcp_enactment
      - domain.sos_state_machine_and_transition_law.constitution_ratification
    parent_admission_required_before_settlement:
      - domain.context_systems.package_compilation
    hooks_mcp_note: >-
      hooks_mcp may admit under the same receipt mechanism, but WAVE_MINUS_1 left_chartered because
      struggle traffic still names the invocable parent; separate settlement membership is policy-optional
      until dotted-id traffic rows exist — admission receipt alone does not force settlement append.

