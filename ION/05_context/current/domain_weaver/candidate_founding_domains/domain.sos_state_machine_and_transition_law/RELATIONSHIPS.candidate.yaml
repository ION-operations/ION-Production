    boundary: >-
      They own delivery membrane vocabulary; I own stdout_to_chat_delivered
      transition definition and evidence field names.
  - target: domain.artifact_provenance_and_gate_legitimacy
    edge: feeds
    boundary: >-
      They own GATE_REGISTRY rows and gate legitimacy; I own settlement_path
      transition semantics bound in gate_registry settlement_path fields.
  - target: domain.state_rank_and_receipt_truth
    edge: feeds
    boundary: >-
      They own rank/accepted boundary truth; I own transition receipts that
      must cite sha-bound evidence before rank claims.

inbound_feeds:
