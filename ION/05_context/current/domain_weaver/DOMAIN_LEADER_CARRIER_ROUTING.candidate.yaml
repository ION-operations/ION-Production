- domain.artifact_provenance_and_gate_legitimacy
- domain.agent_communication_and_settlement
- domain.honest_agency_validation
selection_dynamics:
  default_posture: availability_first
  postures:
    balanced:
      weights:
        quality: 0.4
        speed: 0.3
        cost: 0.2
        availability: 0.1
    speed_first:
      weights:
        quality: 0.2
        speed: 0.5
        cost: 0.1
        availability: 0.2
    cost_first:
      weights:
        quality: 0.2
        speed: 0.2
        cost: 0.5
        availability: 0.1
    availability_first:
      weights:
        quality: 0.2
        speed: 0.2
        cost: 0.1
        availability: 0.5
