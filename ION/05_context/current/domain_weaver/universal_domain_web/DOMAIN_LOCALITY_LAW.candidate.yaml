# ---------------------------------------------------------------------------
# 4. MIGRATION SAFETY
# ---------------------------------------------------------------------------
migration_safety:
  prior_failure_pattern: >-
    Three prior domain webs died when topology moved without resolver + receipt chain
    staying dual-readable; flat candidate_founding_domains became stale pointers.
  phase_0_this_receipt: anchor map only; zero moves
  verify_after_any_future_move:
    - PYTHONPATH=ION/04_packages python3 -c "from pathlib import Path; from kernel.ion_domain_cursor_runner import list_runnable_domain_ids, resolve_domain_execution_bundle; r=Path('.'); ids=list_runnable_domain_ids(r); assert len(ids)>=37; [resolve_domain_execution_bundle(r,domain_id=i) for i in ids]"
    - compare LIVE_DOMAIN_COMPOSITION.candidate.json observed_count to settlement
    - run ion_domain_field_composition measurement
    - per-domain dry-run ion_domain_cursor_runner --dry-run for moved pilot ids
  rollback_story: >-
    Git revert of move commits; restore candidate_founding_domains paths cited in
    FOUNDING_DOMAIN_SETTLEMENT birth_evidence; keep DOMAIN_LOCALITY_LAW anchor_map
    birth_package pointers until a superseding settlement receipt rewrites them.
  dual_read_window: >-
    During pilot, resolver must find package in old OR new path; manifest anchor_map
    lists both canonical_birth_package and future colocated_package_path when set.

# ---------------------------------------------------------------------------
# 5. WHAT BREAKS
# ---------------------------------------------------------------------------
what_breaks_on_locality_migration:
  - FOUNDING_DOMAIN_SETTLEMENT.candidate.json birth_evidence.materialized_folder paths
  - LIVE_DOMAIN_COMPOSITION measurement if it counts only flat founding folders
  - prompt_spawn run receipts referencing context_package paths under flat founding dirs
  - CONTEXT_REQUIREMENTS relative paths using candidate_founding_domains/<id>/
  - domain_self_audit returns and diagnostic packet cross-links
  - MITOSIS_CHILD_DOMAINS_MANIFEST and ALL_24 manifest paths
  - hard-coded paths in .cursor/rules and AGENTS.md (seat paths are separate)
  - activation_plane binding_contracts candidate_boot_path if ever pointed at founding dir
  - historical git grep evidence citing old flat paths (witness only; not blockers)

undetermined_without_deeper_audit:
  - exact kernel module ownership per file for kernel_ownership_runtime_carrier_slice
  - full module list for production_daemon vs graph_event split on disk
  - whether ION_VAULT_LOCAL path is uniform across operator machines
  - live helixion systemd unit paths on host (survey cites modules not unit files)
