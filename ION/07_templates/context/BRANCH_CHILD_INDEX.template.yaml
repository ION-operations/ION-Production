schema_id: ion.branch_child_index.v0_1
status: CANDIDATE_TEMPLATE
branch_id: <parent_branch_id>
purpose: Compact parent-owned navigation index of child branch nodes. This summarizes children for routing but does not replace child capsules.

children:
  - branch_id: <child_branch_id>
    path: <relative/path>
    readme: <relative/path>/README.md
    capsule: <relative/path>/ION_CONTEXT_CAPSULE.yaml
    purpose: <one_line_summary>
    maturity_level: B2_capsule_node
    tags:
      - branch:<child_slug>
      - state:candidate

rules:
  parent_summary_is_not_child_state: true
  child_capsule_required_for_child_work: true
  missing_child_receipt_degrades_state_claim: true
